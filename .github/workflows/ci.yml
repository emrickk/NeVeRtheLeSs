name: CI

# Pull request checks. Pushes to main run the same checks in deploy.yml,
# which gates the Pages deploy on them. Keep the two step lists in sync.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run test:images
      - run: npm run test:rehype
      - run: npm run test:editor
      - run: npm run test:library
      - run: npm run test:safety
      - run: node --test scripts/check-built-links.test.mjs
      - run: npm run build
        env:
          # Empty for pull requests from forks; only needed once a post sets
          # `protected: true`.
          POST_PASSWORD: ${{ secrets.POST_PASSWORD }}
      - run: npm run check:links
