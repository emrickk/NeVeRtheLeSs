<style>
:root{
  --bg:#f6f1e7; --card:#fffaf1; --ink:#2a2622; --muted:#7a7066;
  --line:#ddd2c1; --accent:#b5532c; --accent-soft:#f1dccd; --chip:#efe6d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120e; --card:#1f1b16; --ink:#ece4d6; --muted:#9a8f80;
    --line:#3a332a; --accent:#e0875a; --accent-soft:#3a2619; --chip:#2a241d;
  }
}
:root[data-theme="dark"]{
  --bg:#15120e; --card:#1f1b16; --ink:#ece4d6; --muted:#9a8f80;
  --line:#3a332a; --accent:#e0875a; --accent-soft:#3a2619; --chip:#2a241d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.85; font-size:16px; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px}
header{padding:72px 0 40px}
header .kicker{color:var(--accent); letter-spacing:.2em; font-size:13px}
header h1{font-size:44px; font-weight:900; margin:8px 0 12px; line-height:1.2}
header p{color:var(--muted); margin:0; max-width:34em}
header .byline{color:var(--ink); font-weight:600; font-size:18px; margin:0 0 8px}
header .credit{font-size:14px; margin-top:8px}
.age-badge{
  position:fixed; top:16px; right:16px; z-index:10;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:6px 14px; font-weight:900; font-size:15px; color:var(--accent);
  box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .25s;
}
.age-badge.bump{transform:scale(1.12)}
.timeline{position:relative; padding-left:28px; margin:24px 0 64px}
.timeline::before{
  content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(var(--accent),var(--line));
}
.year{position:relative; margin:0 0 28px}
.year::before{
  content:""; position:absolute; left:-27px; top:12px; width:14px; height:14px;
  border-radius:50%; background:var(--bg); border:3px solid var(--accent);
}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px}
.year-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.year-num{font-size:30px; font-weight:900; line-height:1}
.year-age{color:var(--accent); font-weight:600}
.year-image{margin-left:auto; background:var(--accent-soft); color:var(--accent);
  border-radius:999px; padding:2px 12px; font-size:14px; font-weight:600}
.card ul{margin:10px 0 0; padding-left:1.1em}
.card li{margin:2px 0}
.gap{color:var(--muted); font-size:14px; margin:-10px 0 24px; padding-left:2px}
.gap::before{display:none}
h2{font-size:26px; font-weight:900; margin:56px 0 8px}
.sub{color:var(--muted); margin:0 0 20px}
.thread{margin:0 0 14px}
.thread h3{font-size:17px; margin:0 0 8px}
.steps{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.step{background:var(--chip); border-radius:8px; padding:3px 10px; font-size:14px}
.step b{color:var(--accent); font-weight:600; margin-right:4px}
.arrow{color:var(--muted); font-size:13px}
.reply{
  margin:64px 0 24px; border:2px solid var(--accent); border-radius:16px;
  padding:24px 22px; background:var(--card); position:relative;
}
.reply .label{position:absolute; top:-13px; left:18px; background:var(--bg);
  color:var(--accent); padding:0 8px; font-size:13px; letter-spacing:.15em}
.reply p{margin:0; font-size:17px; line-height:2}
.reply .end{display:block; margin-top:14px; font-weight:900; color:var(--accent)}
footer{color:var(--muted); font-size:13px; padding:24px 0 72px}
nav.years{display:flex; flex-wrap:wrap; gap:6px; margin-top:20px}
nav.years a{color:var(--ink); text-decoration:none; background:var(--chip);
  border-radius:8px; padding:2px 10px; font-size:14px}
nav.years a:hover{color:var(--accent)}
details.full{margin-top:14px; border-top:1px dashed var(--line); padding-top:10px}
details.full summary{cursor:pointer; color:var(--accent); font-weight:600; font-size:15px; list-style:none}
details.full summary::-webkit-details-marker{display:none}
details.full summary::before{content:"▸ "}
details.full[open] summary::before{content:"▾ "}
.essay{margin-top:12px}
.essay h4{font-size:18px; margin:18px 0 10px}
.essay{max-width:34em}
.essay p{margin:0 0 1.15em; font-size:18px; line-height:1.95; letter-spacing:.02em;
  text-align:justify; color:var(--ink)}
.essay hr{border:0; border-top:1px solid var(--line); margin:24px 0}
@media (max-width:480px){
  header h1{font-size:34px}
  .timeline{padding-left:18px}
  .timeline::before{left:3px}
  .year::before{left:-21px; width:12px; height:12px}
  .card{padding:16px 14px; border-radius:12px}
  .essay p{font-size:17.5px; line-height:1.9}
  .year-num{font-size:26px}
  .year-image{margin-left:0}
}
</style>
</head>

const essays = {"2026": [["生日快乐，和菜头先生（2026）", "今天是我五十一岁生日，一个我当初觉得无比遥远且畏惧的年纪。真到了五十岁的那一刻，其实没什么特别的事情发生。但就像是钟表上的分针，从整点向前转动了第一格，然后「咔嗒」一声停下，会有那么一瞬间的空白，一瞬间的真空，我现在就在那里头。", "这一岁过得并不算平顺，精神上也反复经历沉郁甚至黑暗期。幸运的是，朋友们始终在关照我，不时把我拎出家门喝一杯，聊一聊。而且每日写作对我也有很大帮助，导致我没有多少时间去专门沉郁。最后我还有小猫咪，她会无声无息地跑到我身边贴着我的大腿躺下，我伸手摸到毛茸茸、暖烘烘的一小团，就觉得什么都比不上此刻，而我还有此刻。", "昨晚我问我的 AI：在过去一年里，你每天都负责阅读和修改我的文章，根据所有这些文章，请你帮我分析一下，我有什么变化？AI 回答说：", "「你开始从一个不断试图把人生过得更好的人，转向一个希望真正生活在自己人生里的人。」", "好像是这样的，年轻的时候人总是觉得自己前程远大，拥有无限多的时间。于是可以忍耐，可以等待，可以为了某个伟大目标而暂时牺牲生活，可以把很多内心真正渴望的事情留待以后。人过五十，我意识到这个世界并不会因为我努力了就能达成目标，也意识到人生并不因为我有明确计划就一定按计划推进。", "当一切变得不再如我所想时，当时间变得越来越有限且紧迫时，我需要思考所谓的生活对于我究竟意味着什么？我究竟想要从生活中得到什么？", "这一年里我买了很多 CD，从头到尾听完一整张专辑。我想，这可能暗示了我的答案：流媒体曲库近乎无限，我可以在那里获得更多，多年来一直如此。现在我听 CD，从观赏封面和歌词开始，然后是按照顺序听完，在一张碟上获得更深、更细、更多的体验。这个转变从今年开始，我不再追求拥有无限，我选择认真去听一张 CD。很多人一直以为我在谈音乐，谈音乐媒介，谈复古情怀，并不是这样的。", "从另外一个角度来看，在过去这一岁里，我的大部分文章都从生活小事开始写，而且是从我个人的角度入手。而不是像过去那样，站在某个高处分析点评某个社会事件。我越来越喜欢从自己的生活找出问题，找寻问题和自身的关系，而不是从问题里找出自己的立场，证明自己的头脑，或者给出某种普遍的解决方案。和表达观点，证明自身存在相比，我更愿意表达我一个人是如何存在的。和给出观点，给出明确答案相比，我更愿意发现问题，并且让问题引发更多的思考。", "不是说从此就过上了清心寡欲的生活，我对生活依然有热望，内心还会产生欲望，只是和以前的心态不一样了---不再追求多和广，不再追求每样都要来一筷子，我更多时候会考虑如果只剩下一碗的量，这一碗我最想吃什么，如何吃。在我的人生里，面前依然是满满的一大桌，但这件事对我而言变得不再那么重要，我需要专心吃自己面前这一小碗。我如此专心地吃饭，以至于有人用年老来讽刺我的变化时，内心也毫无波澜，更不曾因此变回大胃王去试图证明一点什么。", "剩下的证明题都留给自己了。之前很努力地证明了半辈子给人看，看我多聪明，看我多强大，看我答得多快，但从未证明过一道最基本的题目：如何证明自己的这一生是值得的？也从未证明过一道需要及早回答的题目：如何证明拥有的这一切是自己真正想要的？", "过自己的人生，这就是我目前能够找到的答案。日历翻过一页，时针拨动一格，把我抛向巨大的空白，让我悬浮在无限的真空里，问题比答案多，麻烦比快乐多，失去比得到多。我从未想过五十岁的第一年是这样的，然而很多事情就那么发生了，很多变化也就那么开始了，看似更加平静安定的生活里，内心世界里却经常掀起惊涛骇浪。从这一岁开始，我感觉需要对付的不是生活，而是我自己，否则我在生活里找不到任何一处去安放自己。", "对于那些远没有抵达五十岁的朋友们，我在这篇文章的最后想要对你们说：年岁增长本身不可怕，甚至逐渐衰老的过程也并不可怕，我甚至还在点滴记录这些微小的变化。而在这个生命转变的历程中，我们有可能获得成熟，也有可能获得智慧，我们也终于有可能坐下来不再疯跑，去解决自己和自己的关系，自己和生活的关系。", "也许没有那么多狂喜，也许没有了那么多振奋，但的确有可能在诸多不顺利、不满意、不快乐之中，找到内心的一份确定，确定自己究竟要什么，确定自己究竟是谁。这种确定所带来的释然，甚至超越了幸福和快乐。", "依然会有热爱，依然会有欲望，依然会有激情，但不再像是夜空里的盛大烟火表演，而是更像客厅茶几上的一盏烛光，它缓慢而稳定地燃烧，带来明亮和温暖，陪伴你度过茫茫大海，漫漫长夜。老去并不是一件只有悲伤和失去的事情，虽然依然没有找到答案，但真正的生活和真正的自我正在慢慢显露---这就是我在前方打探到的消息。", "生日快乐，和菜头先生！"]], "2025": [["生日快乐，和菜头先生（2025）", "今天我满五十周岁。", "人不是一下子就跳到五十岁，但有可能在一夜之间老去。此刻我对五十岁还没有多少概念，因为日子是一天天过下来的，变化也是一点一滴逐次降临，于是我很难觉察自己其实已经变了那么多，觉得自己只是刚刚从昨天走来。", "这个昨天可能是1990年夏天的那个中午，我从昆八中骑着自行车从五一路的大坡冲下来，在十字路口的小杂货店一口气喝完整瓶橘子味的亚洲汽水。也可能是在 2000 年冬天的那个傍晚，我醉醺醺骑在马背上从纳帕海吃完烧烤出来，周围白雪飘飞，栈道上只有马儿的铃铛在响。", "所有这些事情就在昨天，虽然我早已经没有一口气喝完一瓶冰镇汽水的铁胃，也不敢再次尝试在海拔 3400 米以上的高原喝醉，而且是在大雪里骑马。但这些事情都曾经发生过，而且一直都那么鲜活，以至于我总以为一切都没有过去很久，以至于我可以不用去思考我现在究竟有几岁，应该做什么事情才配得上这年纪。", "当我还是个小孩子的时候，50 岁是一个大到无法想象的岁数，我也无法想象什么是老去。记得我还是个小学生，午睡时和父亲玩过一个游戏：父亲伸平手掌，让我捏他手背上的皮肤。捏起的皱褶需要等一会儿才会慢慢平复，他说：「这就是老，等有一天你也这样的时候，你就老了」。然后轮到他捏我的手背皮肤，手指才松开，皮肤就立即弹回原位。", "今天早上才起床，我偷偷捏了一下我的手背，还好，和之前的无数次一样，还能飞速回弹。", "如今我真正到了五十岁，感觉要比四十岁的时候好很多，比三十岁时更好，三十岁的时候焦虑达到巅峰，之后就是逐渐变得自如自在的过程，对于年龄增长和逐渐成熟乃至老去可以平静接受。就像是一个愤怒急躁的人，有天终于看到「世界是一个巨大的草台班子」这句话，于是一下子彻底松弛下来一样。人会因为还那些自己没有见到的那部分世界而倍感焦虑，但是也会因为见到的越来越多而逐渐释怀。", "一般来说，很多人在五十岁的时候会报一遍自己的病历，就像是百战返乡的老兵脱开上衣向乡人展示伤疤。也会总结回顾自己的人生，在唏嘘感慨中隐藏着微妙的自得，于是最后一定会给出一些人生教益。这两件事我都不想做，我是连续写作者，在过往的文章中我已经记录了自己生命中大部分重要的事，没有必要在生日时再说一遍，就像是个酒后饶舌的老头子。", "抛开那些往事，抛开那些自我，此刻我想很认真地说一些话：", "生命是一段漫长而奇妙的旅程，无论人正处于哪一段，都无法预知自己将要前往何方，也无法断定自己就是个怎样的人，会有怎样的人生。从小我就是个做事没有长性的人，我也没想到自己从 2000 年开始，在网上一直写到了今天。我认定自己是个普通家庭的孩子，性格保守谨慎，我也没有想到我会从国企辞职，更没有想到我会去创业，而且不止一次。", "站在我十岁、二十岁、三十岁的时候，分别眺望前方，曾经的一个个我无法预料我会变成今天这个样子。如果我回到过去告诉他们，我会在四十岁到五十岁之间不单养一只猫，而且会成为猫奴，他们大概会惊掉了下巴。但生命就是这样的，不是么？许多预料之外的事情，许多自认为不会发生的事情，许多自己坚信不可能是自己会做的事情，不止会发生，而且会改变自己的人生。", "我曾经为什么才是好的人生选择，什么才是对的人生选择而苦恼焦虑，觉得不同的选择带来的结果天差地别。我也曾经坚信某一种人生才真正值得过活，某一种生活才会让自己真正满意，坚信必须去努力实现才有可能获得人生幸福。现在呢？现在我认为生命是一条河流，是河水选择了我，不是我选择了风景。随着河水一路漂流，一路相遇一路分离，一路得到一路失去，我要的幸福就在这无尽的流动之中，而不是在某一段河道，也不在于某一种流速，也不在某一处转瞬即逝的风景里。", "因此，我不会再去想类似「等我六十岁的时候会怎样」一类的问题。「会怎样」三个字里包含了某种期待，某种认定，然而河流带着继续漂流，并不会按照我的想法流经我认定的地方。我也不会去想「为什么我现在会是这样」一类的问题，因为紧接着就是难为自己：会更好？还是会更糟？怎么才能更好，如何才能不糟？河水流淌，涛声阵阵，除了保持游动没有答案。", "奇妙的人生之旅带着我前往未知的下一站，今天我还在这里敲击键盘，唯一能够的证明的事情大概是这样的：无论你是个什么人，你都会拥有独一无二的人生，你会实现部分梦想，但不是以你期待的方式；你会失去部分拥有，却不会如你想象中那么严重。在其中你会和所有人一样，都要经历起伏得失，欢喜悲愁，然而因此结出的果实只是你一个人的，无人能够分享或者体会那果实的滋味。", "因此我们也许可以这么去看：整个世界如此广袤，但它只是你生命之流的背景。人生就是这段旅程拍成的电影，过去无法回溯，未来不可预知，你坐在整个宇宙中唯一的一把椅子上，看这部专为你一人拍摄的电影。这就是我在我这部电影进行到第 50 分钟时，想要对你说的话，也是对我自己说的话。无论在第几分钟，请相信你自己有一部精彩的电影，每一个镜头都值得。", "生日快乐，和菜头先生！"]], "2024": [["今天是我49周岁生日，已然站在了50岁的门槛上。", "以前生日到来时，多少会有些期待，多少会有点伤感，今年的生日我很平静。和任何一个平常日子一样，早上醒来不管是几点都立即起床。洗脸刷牙，看看窗外的朝阳和楼下的风景，然后做每天的功课。做完功课，泡壶茶喝，中间抱起猫咪喂一根猫条。等喝完早茶，我打开电脑画图。选好图上传完毕，我开始写今天的文章。是不是生日，我的每一天都那么开始。", "49岁和29、39岁完全不同，对于即将到来的50岁我没有什么惶恐，对于即将到来的衰老我同样没有什么惶恐。因为衰老这种东西在你完全没有经历前才最恐怖，等到它像是暮色一样缓缓降临在自己身上时，你才会意识到它依然是一种生命的变化。", "和你初中时看到某个人会突然心跳骤然上升一样，只不过这一次要和缓得多，视力不是一下子模糊起来，腰背不是突然间僵硬起来，头发也不是一夜之间变白。每天只有一点点，一点点但是从不停止。在这一点和又一点之间，日子可以照常过，只是你会比20岁30岁时更加珍惜每一天，珍重身边人，珍视手中事。因为你不再盼着飞奔去未来，不再把一切都押在明天，你只是想着过好今天，安住于此刻。", "过去这一岁里，我比疫情时期呆在家里的时间都长，是全国极少数把房租都给住回来的租客。我出门很少，聚会很少，电影旅行观剧看展一类的事情则已经彻底停止。这是心的训练，在没有获得强大定力之间，我需要尽可能翦除‌外界所有让内心产生扰动的因素。保持简单生活，保持日常维护，于是心思逐渐平息，情绪逐渐平复，然后真正重要的那些事情就会清晰地浮出水面---今年我回了三趟老家，前前后后和家人待了半个月---以前完全可以也那么做，但我不知道为什么当时就没有做。", "我们家老太太今年八十岁，短期记忆不是很好，经常丢三落四。所以，在48岁里我最得意的事情就是送了她两台古筝。突然有一天，老太太说要学古筝，然后就去报了个学习班。从此，她成为当期学员中年纪最大，唯一全勤的学生，即便昆明暴雨她照旧出门上课，让老师深感揪心。听说她老人家报名，我就立即买了一台短版的学习用琴给她。一边数落我，一边还是收下了。", "学习班毕业，我又送了一台正式版比赛用琴给她。一边数落，一边还是收下了，并且再也不碰旧琴。现在，她压缩了去小区院子里和老太太们聊天的时间，全部用来背谱练琴。我送过她老人家那么多东西，就数这一件利用率最高，她是真的喜欢，真的每天都弹。不止如此，因为她需要手眼协调，需要记谱记指法，于是短期记忆得到了极大恢复，再也不会整天找手机和钥匙。就有一点，每次打电话回去，最后几分钟要在手机里听她老人家弹一整支曲子，不听完不让挂。", "另外一件得意的事，是引导一位朋友练习观呼吸。他是那种极少见的福德深厚之辈，很快就能入门，很快就变成日常训练，并且在极短的时间内就发生了由内而外的极大改变。按照他自己的话来说，以往就像是活在漫长的梦中，如今突然醒过来，前尘往事纷纷剥落，从此不再受到困扰。生活还在继续，工作还在继续，但是他的心已经完全不同，总是怀着欢喜和感激---我认识他那么多年，他第一次给我看他的全家福。", "有一张照片让我非常喜欢，那是他们一家三口在非洲，看完大象返程去看狮子的路上。当时导游开足马力要赶在日落前带他们去见狮子，他看到巨大的落日正要落入地平线下，阳光照亮了路边一块平坦的巨石。他请司机停车，全家坐在那块石头上看草原日落，辉煌灿烂的金色阳光洒满全身。他们最终是错过了狮子，却没有一个人后悔。他说，多年后孩子不会记得狮子，但是一定会记得全家看落日的那一刻。一整个星球，一整片草原，一家人在一起。", "这些事情远比我自己取得什么成就更令我感觉快乐和满足。就像是这一年是我的音响年，坐在客厅地板上听音乐固然很快乐，看到漂亮的音响固然很满足，但是都比不过发现我的猫咪也喜欢音乐，乐曲声响起，她就会从角落里跑出来躺在我脚边，闭着眼睛聆听。在充斥世界的复杂因果网络中，因为我的缘故，让他人的因果朝着美好的一方稍做转变，我就觉得很幸福，很安然，很自在。至于说我个人得到了什么，失去了什么，不那么重要，起码不如过去那么重要。", "在48年间，此刻我所拥有的东西是最少的，我所过的生活是最简单的，我所面临的未来是最不可预测的，但此刻的我也是最安心的，最富足的，是最满意的。除了训练内心之外，我没有什么别的奢求。于是，生活也就谈不上什么坚持，什么忍受，什么不得不。他人也就不存在什么好坏，什么喜恶，什么应不应该。我自己不因为早上5点醒来而烦恼，也不因为11点才醒而自责，没有那么多必须一定，也没有那么多立刻马上，搞清楚自己这一刻在想什么才是紧要。", "今天是我生日，按照惯例在这一天里要写这篇《生日快乐，和菜头先生》。作为互联网上的一头长久存在，人们通过持续观察我去思考自己，思考生活。通过观察他人的变化，观察自身的变化和成长，观察生活的变化和时光的力量。所以，重点不在我而在于你，不在我快乐而在于你快乐。在复杂多变的人生中，你可能有段时间走过我曾经走过的路，我也可能有段时间踏上过你曾经的步履。此刻，我们之所以在这里相会，也一定存在着我们所不知道的因缘。那么我现在想邀请你和我一起暂且放下自我，共同念诵这段古老的祈祷词：", "* 愿诸众生永具安乐及安乐因", "* 愿诸众生永离痛苦及痛苦因", "* 愿诸众生永具无苦之乐，我心喜悦", "* 愿诸众生远离贪嗔痴心，住平等舍", "这应该是获得个人内心喜乐的最大奥秘，现在分享给你。生日快乐！所有的和菜头先生。"]], "2023": [["今天是我48周岁生日，今年是我的本命年。昨天下午在朋友家里躺在沙发上一小口一小口地吞酒，秋天的下午宁静祥和，小院外面是一树金黄的银杏。就像是一场漫长的清梦，一杯敬过往，一杯敬故人，一杯敬未来的不可知，一杯敬此时此刻一切刚好，一杯敬你依然还在，两鬓尚未全白。", "曾经我们要喝那些清雅的，悠长的，微妙的，复杂的，多变的，丰富的酒，曾经我们要喝品味，要喝审美，要喝知识，要喝故事，要喝气候，还要喝满分酒。如今我们把酒临风，却希望它会是热情的，激烈的，迅猛的，简单的、芬芳的，直接的。因为灰色的马车已经在远处隐隐露出轮廓，需要有东西可以驱散它所带来的寒意。", "在这一岁里，我喜欢上了许多先前不可能喜欢的东西，热烈而简单的酒只是其中之一。我喜欢上了高饱和度的颜色，喜欢上了彩色缎带和缤纷的圣诞树，喜欢上了不加糖的纯巧克力，甚至还喜欢了一阵子紫砂壶。那么多年来，我第一次觉得金子的颜色很好看，只是因为它闪耀着近乎永恒的光。", "与此同时我多了很多东西。因为长期打字，造成肩颈和背部的损伤，所以我的沙发上全都是大大小小的靠垫，我的床上放着各式各样的枕头，每天我就在这一大堆东西里钻来钻去，找寻一个让我觉得放松舒服的姿势。但是每次起身之后，又觉得拥挤不堪，想把它们全都扔掉。", "想要扔掉的不止是靠垫和枕头，过去的365天里我每天都在和AI打交道。这让我感觉回到了2008年，经济危机阴云笼罩，房价不断下跌，与此同时随着智能手机的普及，一整个全新的移动互联网时代马上就要登场。我忍不住时常去想一个相同的问题：假若AI来临，我还能做些什么？", "我已经在用AI做文章插画了，那么文章本身呢？是不是终有一天也要交给AI去写？如果是这样的话，又应该由谁来阅读呢？这些问题没有答案，只是增加了内心的焦虑和不安。还好，我没有把这个问题带到48岁去，而是在47岁之内就已经找到答案。", "具体答案是这样的：人永远不应该和机器比拼任何具体的操作能力，AI画一张画，写一篇文章，计算一道题目，回答一个问题，都会比人强。但是人之所以为人，并不在于这些地方。而是人可以根据现实的情景，分析、归纳、整理出真实的问题。发现问题是人独有的能力，无论这种问题是内在的还是外在的，需要有人提出正确真实的问题，AI才能进一步做出解答。", "AI可以在几秒钟之内画一张图出来，然而画什么，为什么要画，这是人才能做的事情。同样的，一篇文章需要人先去想清楚，究竟要写什么，为什么要写它。同样是一篇工作总结，你写和我写就不一样，你用机器写和我用机器写也不一样。所有的工具只是增加了人和人之间的差异，机器本身并不针对任何人。在一支军队里，神枪手的待遇要比其他普通战士更好。但是，军团的司令官并不因为枪法好而获得指挥权。他找寻敌军主力，分析敌军意图，制定作战计划，指挥战斗进程，但他的枪法可能是最烂的一个，他对武器的熟悉程度可能也不是最好的一个。", "结论是不要把宝贵的时间浪费在阅读科技新闻上，学习使用各种新型AI上，更多的时间应该用于阅读和思考，继续培养自己分析问题，发现问题的能力。那是人类的长项，做好人类的长项就好，剩下的交给AI去做。人人都有AI帮忙的时候，每个人的具体想法就很重要。小时候，我们一群小孩子在研究基地里比剑，所谓的剑是用当时计算机的储存纸带卷起来而成。都是纸带，大人们用它去计算高深的物理问题，我们则挥舞着用它做成的纸剑朝着彼此的脑袋上招呼。", "机器不曾替代过人，永远是人在替代人。", "所以这一岁里我读了许多书，尤其是意识领域和脑科学领域的书籍。原因也很简单，那里是一片陌生和荒芜的土地。关于那里的任何一本书，都在向我展示科学家们在一个全新的领域内如何发现问题，从哪里着手，又是如何通过分析锁定，最后则是用怎样的方法加以验证。我自己既往的知识储备不再起作用，阅读这样的书籍迫使我同样从零开始，跟着那些科学家重走一遍发现之路。我并非是为了获得新知而去看这些书，我纯粹是为了训练思维而去阅读。不管有没有AI，AI能否统治世界，这样的能力都是人所必需的。", "为此我减少了很多看电影的时间，看剧的时间，看手机的时间。我花了很多时间去陪伴我的猫，一直到他生命终结。我不觉得这是在浪费时间，恰恰相反，我的猫咪在他生命中的最后一段给我上了很好的一课，关于生命的课程。他从我手边暖乎乎毛茸茸的手垫，变成了我电视机前蓝色瓷罐里的一小堆灰烬，生命的无常和死亡的冰冷赤裸裸地在我面前如此展现，就像是此刻的秋风一样具体。", "如果不是因为他，我对现状要忧虑百倍。人到中年，谁没有忧虑呢？我每日的祈祷回向名单，一日长过一日，家人，朋友，朋友老病的父母......但是我的猫死了，生命如此脆弱易逝，无论我如何努力，如何挽回，他还是一下子倒头就死去了。而我唯一值得高兴的事情，是他没有一天活在我的担忧里，没有一天活在我的悲伤里，他度过了无忧无虑的一生，他的皮毛上不曾沾过我的一滴泪水。除了生命本身之外，没有那么多值得担忧的事情，也不应该让担忧占据心情的大部分空间，否则在一切终结的时候会让人感到懊悔。", "无常随时可能降临，因此需要思考生命的意义所在。人们在生日切蛋糕，吹蜡烛，发射纸炮。这些都是美好而快乐的事情，而我认为我此刻要比这样的快乐还要更快乐一些。因为我在这一岁里经历过这些事情，没有让我变得灰暗消沉，反而激发出了我对生命的热爱，对生活的热爱。我并没有因为长期宅在家里，失去了对生活对世界的感受。也没有因为肉体上的疼痛，变得愤怒和暴躁，无法安定地坐上一会儿。因为我的猫给我上过一课，他说：", "你此刻悲伤，那么你要清清楚楚知道你悲伤；你此刻快乐，那么你要清清楚楚知道你快乐。你不要在这一刻回望上一刻，也不要在这一刻幻想下一刻，以至于丢失了此时此刻。我靠在你身边，你就要具体地感受皮肤上的所有暖意。你伸手摸我的头，你就要具体地感受每一根毛发在掌心里的感觉。你如此度过每一刻，那么每一刻都堪称完满，绝无遗憾。", "生日快乐，和菜头先生。"]], "2022": [["今天是我47周岁生日，明年是我本命年。记得去年的今天，我和两个好朋友吃涮羊肉庆祝生日，临窗座，落地窗，桌上铜锅沸腾，窗外大雪纷飞。我们举杯说：希望明年一切都能好起来。究竟好起来没有我现在不是很清楚，但我觉得另外一位好朋友的话很有道理，他说：", "“人间一切事，莫过于习惯。就像现在我们习惯了核酸，俄乌习惯了鏖战，美国习惯了加息马上又要习惯加班。”", "原文并不押韵，是我给改的。人总是会有一些根深蒂固的偏好，比如说解释世界。世界何以如此，我们何以如此，总是需要有个解释。但如今的世界我解释不了，只让我觉得陌生。那个曾经亲切友好开放乐观的世界似乎消失了，现在的这个世界严厉冷酷并且慢慢封闭。但是走在街上感觉又不一样，树上的叶子还没有完全凋零，蓝色的天空沉静安详，有时候在白天还能看到半个月亮，似乎这一切对于世界的改变毫不在意。", "这是我在疫情下的第三个生日，很快我生命中的十分之一会在疫情中度过。每个人年岁不同，占比不同，感受也就不一样，那些占三分之一、五分之一的人，可能对世界对生活的看法会完全不同。我上一次进电影院应该在一年多以前，但我还有四十多年关于电影院里看电影的回忆。我上一次在街上感受到人们会挨着我的肩膀是在三年多前，但我此前还经历过无数次类似的体验，在北京八达岭在上海外滩在深圳世界之窗在广州上下九......他们呢？他们可能已经习惯了人和人之间保持半米的社交距离，像个北欧人那样。", "2000年的元旦，我在昆明绿洲酒店和一群人欢度新年。雪白的桌布上布置满了鲜花，银质的餐具闪闪发亮，香槟杯内壁上挂满了小气泡，新年倒计时开始 ，所有人侧身坐在长桌边，一手举杯，一手整体划一地拍桌，等待21世纪到来，等待所有的日子所有的希望所有的美好向自己奔来。我真没有想到21世纪会是这个样子的，镀金年代悄然褪色，迎面奔来的是冰桶挑战。", "生活在改变，我自己也在做调整。从去年生日到现在，我在《槽边往事》连续更新了365天，一共发布470篇文章。从今年5月18日开始到现在，我连续用AI软件画了接近半年的图。以及这一年里我有300多天早上7点起床，看过300多次朝阳。", "很重要么？都不重要。日子像流水一样，匆匆之间流去，把时光变成流年。在流年之中，人做或者不做什么没那么重要，因为最终都会东流去。但我还是选择做一点事，是因为我需要在生活里放上一点配重，生命里放上一点压舱物，这样在流年似水里不会漂浮无依，随波逐流。每天起床，如果有三件必须要做的事情，又和工作学习无关，人心就会定一些。世界上每天都有好消息坏消息传来，人心定一些就可以少一些焦虑紧张，少一些起伏不定。因为分不出那么多心神去感受，去思索，你得先把手头的事情给完成。", "以前做事多少都有点想要证明自己的心态，一定要追求个结果，把人生过成奥林匹克竞技，随时追求更高更快更强。如今看来，哪里有那么多的最高最快最强？一个人能把心安住就已经很不容易了，这样事才能单纯回归到事，人也才是简简单单的人，不会因为悲观焦虑而沮丧，也不会因为无能为力而愤怒。做事追求结果可以成就自己，做事沉浸于过程却能够滋养心灵。", "我想，每一个人的生活都有个主题。但这个主题最好还是由自己来定，而不是由他人由社会由时代来定。它们力量强大，会裹挟着一个人走，这时候就有必要捍卫自己的生活，也就是捍卫自己生活的主题。他人给予的主题可能是悲观，社会给予的主题可能是萧条，时代给予的主题可能是疫情，但如果它们就此变成自己生活的主题，那么自己的生活也就随之消失了---当初我们拿了前往地球的单程票可不是为了这些。", "所以连更这个行为不重要，但是连更多作为主题对于我的生活很重要。AI绘画这个技能也不重要，但是学习新技能作为主题对于我本人很重要---其他主题是坚硬的现实没错，但我还有属于我自己的生活，我有我自己的生活主题，那我就还能有柔软和轻灵，这种柔软和轻灵最终又可以成就我作为一个人的坚韧。人人都身处现实，但如何存在却有不同选择。这一年里我是这么想的：人不能靠一直保持对现实生活的应激反应而活着，那样的人生是会发炎肿胀的。", "今天是我47周岁生日。此刻我深感庆幸，因为在过去的这一岁里，我每天要忙于更新，每天要应付催稿，每天还要陪伴猫咪。当世界变成这个样子的时候，我的生活里还有另外一些存在，它们让我保持活力和热情，始终拥有一些专属自己的个人光亮。这点光亮远不足照亮整个世界，但一个秃子的天职不就是发光照亮周围的人么？", "生日快乐，和菜头先生。"]], "2021": [["今天是我46周岁生日，可笑的是我此前一直以为是45岁。和去年相比，这一岁里我毫无疑问要积极很多。8个月保持连更，中间居然没有中断过。无论生活中发生什么事情，内心又是如何震颤摇撼，早上起来第一件事情还是打开电脑开始更新。", "如今的公众号当然不能和全盛之日相比，人们都跑去看短视频玩游戏去了，轻轻松松写出一篇10w+文章的日子一去不返。但对我而言，反而是在这段时间写得最认真。因为到了这时节，愿意读的人才是真读，那么写的人怎么好意思不去真写？更何况老天待我不薄，可以让我在那么长时间里没有遭受任何足以中断写作的打击。于是在敲击键盘的时候，我也心存感激。", "在45岁接近尾声的时候，我迎来了这一岁中最大的变化，就是变得平静柔和起来。也不是说一直如此，依然有暴躁愤怒的时候，只是和之前相比这样的情形要减少了许多。其中有理解力增强的缘故，于是眼中不可思议不可接受的人和事都变少了，他们有他们的理由，无非是我是否赞同而已。在我眼中，我自己也变得没那么重要，我赞同与否同样变得没有那么重要。", "另一方面，我觉得是我放弃了对他人，尤其是读者的寄望。以前我总觉得如果他们能这样想是好的，能那么想是对的，也许通过阅读他们会有这样的转变。如今我觉得这是一种纯粹的傲慢，我连养一盆花都未必能按照我的心意成长，我又凭什么对别人有所寄望？我看别人的想法有问题，在别人眼中看我，也许看到的问题还要更多一些。现在，每次想要纠正别人的时候，我总会在心头先想一下家里那盆光秃秃的花。", "做到这两点，人就变得没那么暴躁易怒。但是，平静柔和此时也依旧是一个假象，随时都可能破裂掉落。因为我在45岁遇见的问题要远远多于答案，自己觉得迷惑的时间也要远远多于明悟。30岁之后人会变得越来越笃定，这种笃定从哪里来？来自经验。经验总能起效么？我现在对此深深怀疑。世界实在是太大了，我们每一个人趴在世界的一个小角落里，费尽全身解数也只能看到一丁点大的地方。从那一丁点大的地方所得来的经验，大概没有办法用在所有的地方，连用于类似的地方都够呛。", "我感觉自己就是一块小零件，世界则是一台巨大和复杂到无从想象的机器。虽然没有依据，但我感觉它的表面应该是个球形。这么多年来，我一直在试，在找，看有什么位置刚好适合我的形状，放进去“咔嚓”一声就严丝合缝地嵌入其中。当然是没找到，否则我也不会有那么多困惑。当困惑升起时，所有的柔和平静都消失了。如同在梦中找不到房间出口，如同在梦中一样绝望地抓着头皮。", "回想我二三十岁的时候，在五六十岁的大叔面前侃侃而谈，他们的目光中有东西一闪而过。大叔们很谦虚，说是年轻人的想法能给自己带来许多启发。现在我相信需要启发是真的，但并不是主要目的。我逐渐能够理解当时他们的想法：这个人之所以能说得那么流利，是因为他从未真正做过什么事情，不知道任何一样事情成立需要多少条件，所以才可以不管不顾地提出那么多种方案，根本不去考虑任何可行性。干！但是那种不管不顾的精神头多么美好啊！", "过去的四十五年大概就是这么一回事，虽然找不到可以严丝合缝嵌入世界的位置，但我还是狂奔到了今天。回首的时候会有许多恐惧，因为在许多关口我只是运气好一点罢了，如果当初稍有错位，可能完全不会是现在这副模样。以至于我忍不住去想：所有这些年，所有来北京之后的经历，它们对于我究竟意味着什么？出发时我究竟想要找到什么，此刻我又找到了什么？", "其实我没想找什么，我只是想去山外看一看世界，我认为在远方会有不一样的人生。如今我身在远方许多年，看到了更广阔的世界，结识了更有意思的人。然后我坐下来，开始考虑如何安放我自己。很难在短时间内得出答案，在那么多尝试之后，我还是没有找到一个安适的坐垫。我对世界有更多困惑，我对生活有更多困惑，我安安静静坐在那里，看着自己的念头不断浮出水面，我对自己也很困惑，有时候甚至会感觉到陌生。因为这么多年来，我一直在观察世界，却对自己并不熟悉。", "我说：你都46岁了，难道还是不能想明白么？好像的确如此，我并没有因为年岁增长而获得智慧，寻求到内心的持久平静。在四十岁之后，每一次生日到来之前，我都有周身燃烧的感觉。有个声音在催促我继续前进，而我每一次都倔强地回答：那你是要我去哪儿？我希望在47岁到来之际，能够找到答案。在此之前，估计我还是只能一篇接一篇更新，如同一下又一下的捶打，虽然是个很笨的方法，但也许锤击到我所有的壳子尽数剥落，答案就会自然显现出来。"]], "2020": [["今天我满四十五岁。当我还是个孩子，遥望21世纪，觉得那是遥远得不了的未来。而眼前的学校生活，还需要掰着手指算很多年才是尽头。于是，关于未来的想法大多以小小叹口气作为结束。此刻，我已经身处21世纪，而且已经度过了它的五分之一。", "去年的今天，我绝对想不到在新的一岁里会面对如今这般光景。相信在许多年之后，2020年也绝难从记忆中抹去。在我45年的生命中，从未有过那么长一段时间独自一人呆在家里，连小区大门都没出过。也从未有过那么长一段时间处于沉郁的精神状态之中，一天到晚看到不到一条好消息。我猜想，二战时生活在战区之外的人们大概就是过着这样的生活，有着同样的感受。", "他们列举了历史上许多伟大的文学家，讲述他们在大疫流行期间的丰硕创作成果。我由此判定自己永远也成为不了一名伟大的文学家，因为我根本无心写作，一丁点都不。我宁可花很长的时间躺在沙发上，看着我的猫趴在我的大腿上如何慢慢入睡。在这个风雨飘摇的世界上，我很高兴自己还有一点点用处，可以让一只猫找到个舒服的睡处。整个疫情期间，我的两只猫给予了我极大的精神抚慰。只是看着他们晒太阳、翻肚皮、随意拆家，也能让我感觉到平静生活之下的力量。有时候我和他们说话，仿佛他们能够听懂似的，甚至因此而吵了起来。不时和猫吵架，让我恢复了许多活力。", "在那么多年之后，我第一次想在生日送自己一份礼物。十一长假过完，我想把体重从106降到100公斤（为了阅读方便：从212斤到200斤）。为此，我进行了两周的低碳间歇性断食，然后彻底转入生酮饮食和有氧锻炼。一开始我并不是很看好自己，因为我从小就擅长放弃锻炼，同时我也喜欢各种美味，别人每天翻淘宝作为消遣，而我则以翻大众点评和下厨房为乐。没想到我还是坚持了下来，我怀疑主要原因是被生日临近所惊吓。今天终于收获成果，100.8公斤（就是201.6，乘法不会自己算啊），并没有完美达成目标。但是，我都已经四十五了，也不要对自己太过苛刻才好。更何况血压不再高低起伏，血糖基本一条直线，那我还应该奢求什么？", "作为一名写作者，过去一岁之中最大的挑战是视频。几乎所有我在博客时代认识的旧人，现在都已经转入视频领域。不是去做短视频节目，就是开了美颜做直播。许多人还是我十多年来第一次见到本尊，坦白说，视觉效果比四十五岁生日还要惊悚，连累我背了许多回纳兰性德的经典名句。如果我再年轻5岁，可能也会纵身一跃，跳上视频的快车，让中国视频界多一枚中年圆脸，反正现在也并不少。但我最终还是没有动身，因为实在想不明白可以在视频里做什么？在思考的过程中，南派三叔给了我很大的启发。最近他出版了一本小说《世界》，而我和他第一次讨论故事大纲的时候，是在2011或者2012年，当时我们开着车在深圳北部的山区里绕来绕去，一会儿进入绿色的雨雾，一会儿又开进明媚的天光。我见过他的手速，也见过他如何连载小说。但是，这样一部早已确定大纲的小说，却依然耗费了八年时间或许更长。人生能做好一件事情就已经很幸运了，哪里能步步争先，处处得胜？", "很遗憾，过去的一岁里我没有什么成绩单。在沙发上打坐就打了半年，自然也就谈不上做了什么。不过，也正是因为这难得的半年时间，让我安安静静想了许多事情。许多年来，我内心真正的隐忧是惧怕自己成为我父亲那样的人。当然，我父亲可能并不认同我对他的看法。我不能批评他过往的种种，因为他已经过世，没有办法为自己辩护，所以这不是一件公平的事情。为了要和他不同，这在过去很多时候是我的支撑。撑过去了，我就多了一种隐秘的快乐，就像是跳进了树荫从而逃脱了日影。如今，当我也到了45岁的时候，突然发现这件事情再没有那么重要。我的确成长为另外一个人，过着另外一种人生。同时，我也保留了他古怪的脾气，偶尔莫名的阴郁悲观，以及在生活中大量的走神，就像是同时活在平行的别处。今天我要说，和某一个正面的或者负面的标杆做对比，并不是生活中最重要的议题，更不应该是生活的内在轴心。自全要远比对抗或者逃避更重要，没有对比一个人也能成为他自己。那样的一个人，才会是一个全然自由的人。", "祝你生日快乐，和菜头先生！"]], "2019": [["从朋友的生日祝福里知道自己今天满几岁，40岁之后的日子和视觉一起逐渐模糊。2000年我25岁，在香格里拉看山。从山顶的积雪看到山脚的森林，再看到面前的草甸河流，觉得山林如同骑兵从山坡冲击而下，在草甸边缘勒住马头，拔地而起。2019年我在回忆里重新端详那山---山林走在山坡上，向着峰顶攀爬，一路上队伍越见稀疏，最终在雪线前很远停住脚步。我觉得我的记忆想要说些什么，但是它只是沉默。", "对于我的两只猫，我保持着同样的沉默。随着他们一天天长大，我在网络上提到他们的次数就越少，照片简直已经绝迹。而我每天下班就飞奔回家，为的就是可以缩在沙发一角，让猫躺在自己怀里，听他们轻微的呼噜声。我经常和他们说话，有时候争执，但总能够最终谅解，因为时间久了都知道对方的想法，就像是轻轻抚摸头顶，他们就会自己扬起下巴一样。这样的事情都发生在沉默里，在那里拥有最丰富的细节和最琐碎的真实，诉诸文字却总是会带来缺失。", "在我的43岁里，可以称之为年度个人成就的只有一件事，那就是成为纪录片《四个春天》的出品人。这部杰出的作品在豆瓣获得8.9分，我个人也非常喜欢。迄今为止，我都认为它具有大部分国产电影所不具备的朴质与真实，也没有几部片子能像它那样深入生活的肌理，却又保持着诚实和克制。也是通过这部片子，让我第一次认识到人们对真实的生活是怎样的避犹不及，他们并不是如同他们嘴上说的那样厌弃浮华与乔饰。从寻常生活里发现其中的蕴藏的美，原来只有极少数人能够做到。", "也是在这一岁里，我几乎通读过所有大陆出版的保罗·奥斯特作品。许多年来，我第一次通读同一位作家的作品。之前的许多年里，我的阅读过程就像是在荒野上漫无目的地游荡。我读过许多书，其实根本没有读进去，但是也多多少少留下了点东西。这些东西被《斯通纳》引燃，到了奥斯特的作品终于爆发。我无法用语言形容自己在其中到底得到了什么，我只能说现在我开始有点明白什么是好作品，开始理解作品之间的差异在于什么。在一位作家身上，看到他如何建构一整个系列作品，仿佛自己也知道了其中的奥妙。虽然这种明悟来得有些晚，但总比从未到来强。", "这件事对我的影响远不止于此。我忍不住去想一个问题：如果我读书近四十年，持续写作二十年，才终于获得那么一点点领悟，那么这个世界上究竟有什么事情是可以速成的？在过去的好时日里，时代仿佛是给予了人们某种肯定，鼓励人们进入新领域，鼓动人们跨界生存，甚至发明出“斜杠人生”这样的概念。真的有这样飞扬轻盈的人生么？生活究竟是一颗葡萄，还是一头犀牛？需要多少努力才能突破它的皮肤？", "我在43岁结束44岁开始的时候有个想法：世界其实并不需要我们中的任何一个。离开了任何一个人，山川依然是山川，河流依然是河流。是我们自己需要向世界证明自己值得接纳，在这个世界里找到某个属于自己的位置。为了得到这个位置，需要付出长期而艰辛的努力。而世界倾向于拒绝这种努力，因为它看起来就像是肌肤里的一根刺，一种轻微的炎症。任何时候只要有可能，世界就会把刺排斥出去，留在表皮上，然后等一阵风来吹走。所以，你得嵌入到世界中去，从皮肤深入肌肉，从肌肉渗入骨骼。只有到了这个时候，世界才可能需要你，因为少了你，它也失去了一部分。否则，一个人就总是会担心风。", "一棵树站在山坡上，一直那么安安静静站着。需要站成一片茂密的森林，在少年人眼里才会变成侵掠如火的骑兵，在中年人眼中才会变成漫步山坡的登山客。无论风朝着哪个方向吹，希望你内心里也有这样一片山林，希望你也能听见它的沉默。", "44岁生日快乐，和菜头先生。"]], "2018": [["今天是我43岁生日。早起打开微博，看到热搜榜上没有我的名字，名字后面也没有蜡烛，就觉得长出了一口气；再仔细翻翻榜单，发现阚清子道长又出现了，说明世界依然还是那个世界，顿时让人内心安定下来。", "昨晚雕爷在群里问我：菜头，43了？虽然事实的确如此，但是等自己真看到这个数字的时候，还是觉得有点眩晕。我只能闷闷地回答了一句：是，43。结果他又补了一句：那我都45了，你说咱们好好的怎么一下子就奔50了呢？当时我就觉得眼前一黑，重新找回了30岁生日前夜的感觉。", "30岁的时候，对于未来的日子有期盼也有惶恐，但并没有太多焦虑。时间终归还是在自己这一边的，大把机会还在前方，只是从现在起要稍微审慎认真一些。40岁的时候焦虑会增加许多，就像是和命运斗地主，他起手就是一个长顺子，然后又是一对K，手上的牌就只剩下小半了。命运拿着牌斜眼着你：要不要？你看着手里最大的三条A，犹豫着要不要拆开跟一下，但又担心从此失去了牌权。你转头看着运气，希望他能有所暗示，但是运气面无表情，目不斜视。经验这时候走过来拍拍你的肩，说：别想了，你得一个人打两家。", "过去的这一年不容易，这不是我一个人的感受。做什么都很难，如果说过去付出十分就能收获五分的话，过去这一年里付出十分也就能收获一两分，能够到三分就已经让人笑逐颜开了。在那些顺利的年景里，好像做任何选择都是对的，事情最终总是能成，人甚至因此有了一种在顺流而下里的从容。而在那些艰难的岁月里，世界陡然变得严厉起来，人不再是顺流而下而是推石上山，选择和选择之间差别不大，无非是一种辛苦和另外一种辛苦。老实说，我并不喜欢推石上山这个比喻，它还不如蜣螂，别人起码推的是自己的口粮。", "在十年、二十年、三十年的时间里，我生活在一个充满乐观的世界里。无论是谁过生日，你在生日会上问他：你觉得你明年会比今年更好吗？会赚更多钱，会升更高职，会换更大房，会成更多事，会看到更大的世界，会结识更精彩的人吗？答案都是肯定的，甚至在当时对于如何实现都毫无头绪，但是人们对未来依然都有一种天真的自信，觉得明天会更好，而且自己一定就在其中。因此，所有的辛劳，所有的付出都是值得的，人们并不将其视为难以忍受的负担，而是一种个人荣耀。世界也不是一个危机四伏的丛林，而是不断增长的财富游戏，只要你敢想敢搏，在这个游戏里事事无碍，甚至发行货币你都不需要买点纸去印。", "身处这样的狂欢氛围之中，我总是情不自禁地会产生一种幻想：想象我小时候，一群小孩子在一片空地上疯狂追逐打闹，不断大笑尖叫。那片空地可能是某个单位庭院，也可能是某个停车场，又或者是个工地。小孩子们玩得忘乎所以，觉得那片空地就是他们的天下，可以一直那么疯玩疯闹下去。但是总有那么一个时刻，会有一个成年人拿着棒子冲进来，劈头盖脸就是一顿暴打，宣布这是有主之地，勒令大家滚蛋。于是孩子们从狂欢中惊醒，鼻青脸肿、哭爹叫娘地四散而去。在任何一个乐而忘形，为所欲为的时刻，我总是会想起那个提着棒子的成年人。我觉得他才是这个世界的本相：粗暴、严酷、保守、冷漠无情。这是个循环，孩子们不断找寻空地，抢在那个成年人和那根棒子赶到之前狂欢。", "所以，我在这一岁里养了两只猫。世事是抽象而宏大的，而且多半无解。但是猫却是具体而柔软的，而且勉强还能琢磨。养猫会带来一系列麻烦和负担，最后还不得不承受失去的痛苦。无论是生老病死，还是离家出走，都在可以预见的将来。但我最后还是养了，于是生活里多了喂食、换水、倒猫砂、看医生、打疫苗，还要挨抓、挨咬、挨吵、挨漠视、挨冷暴力。按照我对世界的理解，我本不该养猫，而是应该尽可能地斩断自己和这个世界的羁绊。这样，狂欢与我无关，乐园与我无关，大棒也与我无关。如同我多年前说过的那样，房间里只有一个背包，一个行李箱，任何时候提起来就能走。", "但不知道为什么，第一次感觉到小猫在我脚边绕来绕去的时候，我在皮肤的痒里突然获得了一种久违的宁静。每天当两只猫叫我的时候，躺在我面前翻身露出肚皮让我挠痒的时候，看见我打开罐头用光速冲到我身边不断扒拉我的手臂的时候，我发觉被这个世界需要的感觉很奇妙，哪怕是两只猫咪，都会让人感到心动。做一个世界的冷静观察者，抱着手站在一边，和走进世界抱起两只猫，感受到他们的体温和重量，是截然不同的两种感受，它们对一个人心性的影响也完全不同。", "就像是此刻，我在电脑前打字，猫咪过一会儿就跳上我的膝盖，坚持要在键盘上走一遭，留下一行字迹。看看屏幕，再看看我，最后喵一声跳下地跑掉。在我之前的42年人生经历里，从未有过这样的体验。我听见猫分明在对我说：", "如果和人世没有任何羁绊，那你就是孤零零悬浮在这世上。", "生日快乐，和菜头先生！"]], "2017": [["用右手食指和拇指轻轻捏起左手手背上的皮肤然后放掉，越是靠近生日，我就越是控制不住地去做这个动作。每次松开手指，看到皮肤飞速弹回原状就觉得心里有些宽慰。但我确知和过去还是有所不同---捏起的皮肤上会出现细而密的纹路，就像是缓慢流动的溪水经过小石块所激起的水波。以前，它们并没有那么密，也没有现在那么浅。", "2017年11月5日，我42岁。", "20年前的现在我正在昆明巫家坝机场上班。三间房，两部座机，一台电脑兼发报机，一部雷达控制台。24小时一班，三班或者四班倒换。有一面墙全都是柜子，一米乘一米的正方形柜子，刚好可以塞一床被子进去。旧人退休，就站上凳子，把自己的被子抱出来，再把钥匙移交给新人。新人抽掉柜子里垫底的报纸，换上当天的《春城晚报》，然后再把自己的被子塞进去。换下来的报纸是十多年前的，有的甚至还要更早一些。有时候大家就站在那里翻看，回想起许多陈年旧事。", "9年前的现在我正在北京中关村银科大厦上班。环形的办公区，中间是会议室，其余的部分是密密麻麻的工位，空调和电脑风扇不断发出嗡嗡嗡的声音，我那一层都是黄色的壁板和墙，置身其中就像是站在巨大的蜂巢深处。穿过整个北四环，在超出视线边界的地方，巨大的光缆把蜂巢和酒仙桥的服务器阵列连接在一起。每天十数亿次的访问从全国各地而来，等待着银科大厦的工蜂们为它们提供可以消费的内容。然后它们又返身离去，消失在无数个房间里，无数台电脑之后，如同永不停歇的潮汐。一年三百六十五天，一天24小时，蜂巢里总有工蜂忙忙碌碌。", "人们说，一个人需要有直接看到未来的洞见。我在往柜子里塞被子的时候，并不能看到海淀的数字潮汐；我在海淀的蜂巢里忙忙碌碌的时候，并不能看到我的42岁。我只是惧怕那些规则的物体，就像是一面墙的齐整柜子，或者是一模一样的工位。我惧怕自己变成一床被子，我惧怕我变成一颗比特。我丝毫不会怀疑，柜子长成什么样子，最终我也会变成什么样子。光纤有多粗，最终我的直径也就只能那么大。然后时光缓慢而坚决地压下来，你曾经可以和生活对撼的坚固瞬间烟消云散。敞开的柜门里喷涌着白色冷雾，囚禁在线缆里的比特面对着灿烂千阳。", "无论是在20年前还是在9年前，我都不可能想到我会在41岁的时候开发小程序，写网上付费专栏，和两队人一起拍摄短视频，开办农业科技公司，把自己的ID印在罐头上。也不可能想到我会去看那么多剧本，甚至还要修改，在人们观赏之前，自己已经看过无数遍。在上网的头十年里，我喜欢说因为网络的缘故，我活出了第二生。在四十岁后，我发现一个人仅仅有两生是远远不够的。如果你愿意的话，总是能找出新的路径去接近这个世界，创造之前不曾出现过的东西。在这个世界上，你总有办法成为一块不规则的拼图碎片。然后，你也总能找到一个把自己镶嵌其中的地方，于是你就能看到沿着你的边界在不断涌现新的可能，而且永远都停不下来。", "我自认为不算是个聪明人，也缺乏毅力和远见。一直到今天，我在心底里都还时常浮现一个相同问题：人们喜欢看我写的文章，会不会只是一种绝大的误解？其实，我写的远远不够好，只是他们并没有太多选择罢了？只是因为我存在的时间足够久，他们不像对待一个新鲜人那样地挑剔？也许我已经成为了一头网络吉祥物，就像是一头熊猫，只要看到它还在吃竹子和打滚人们就已经心满意足？而吃竹子打滚这样的事情，大部分小动物都可以，熊猫的特别之处在于它只会这两件事，所以它就成为了这两件事本身？", "好在许多事情并不用想得很清楚，一个人也可以走出很远的路。反正长路迢迢，他可以在这一路上慢慢琢磨。哪怕想得慢一点，总能一点点领悟到一点什么。而且，只要脚步不曾停下，在远方就总是存在着找到答案的可能。也许就有那么一天，会来到一片蔚蓝澄澈的大海。除了无限延伸的天空、海面和沙滩之外一无所有。日光倾撒下来，届时一切答案都不再重要，重要的是你已经抵达。", "记得父亲在我这个年纪的时候，经常捏起手上的皮肤给我看。当他松开手指，皮肤的皱褶需要很长时间才能缓缓展开复原。父亲对我说：你看，没弹性了。我问他说：这说明什么？父亲答道：我已经老了。", "祝你生日快乐，和菜头先生！"]], "2016": [["今天是我41岁生日。", "算是正式迈进大叔的行列了吗？我不知道。我只知道，我终于抵达到了儿时无法想象的遥远的四十岁以后，进入了成人世界的深处。但是和我早年间的想象完全不同，自己并没有变得无所不能，也做不到随心所欲，所谓的“成熟”并不意味着安定的现世，它只不过照亮了更远一点的世界，因此发现了自己身上惊人的无知。纵然现在的每一岁里，都要比过去的一岁里能完成更多的事情，但这个速度永远也赶上那些激增的问题数量。自己变强了，但是世界也变得更加复杂了，生活是一张永远做不完的考卷，难度并非是随着时间线性增长。", "过了四十岁之后，人生终于开始像一部真正的电影。什么是真正的电影？就是对于主人公而言，他的得到是真正的得到，他的失去是真的失去。十几二十多岁的时候，人生更像是电子游戏。无论你怎么荒唐胡闹，按下“重启”键一切就会复归正常，可以从头再来，因为并没有真的得到什么，也就不会真的失去什么，跌倒再多次也没有多大关系；三十多岁的时候，人生开始像舞台剧。当你演砸了的时候，不再是你一个人的事情，这一晚所有人的努力就白费了。而且，这一晚过去了就永远过去了，它不会重来，更无法修补。但是，你依然可以争取第二晚演出成功，以及接下来的第三晚、第四晚......人们会忘记第一晚的意外，认为那是成就伟大的必要预演。", "电影不能重拍，在大银幕上放映的时候，它是什么样子就是什么样子，谁也不能再做更改。四十岁以后，他们会把按钮交到你手里，或者你抢一枚抱在怀里。一旦按下去，就会对真实世界产生真实影响。如此，决定才是一个真正的取舍，责任才是一种真正的重量。这一次，没有回撤，没有取消，也没有办法回滚到上一个版本。世界在你对面坐下，从左轮枪里取掉5颗子弹，猛地旋转弹仓，把枪拍在桌子上说：“这一次，我们来真的！”", "老男人让人生厌的原因也在这里。一部分人总是做出全世界只有他自己面对这把左轮枪的样子，然而人人都知道这不是真的，有些人面对的甚至是世界手里的柴油链锯；另一部分人总是想偷偷换一把水枪表演勇敢，而且以为别人看不出来，但是人人都看到了他们脑袋上的水，无论是在外面还是在里面。老男人都有一种共同的隐忧，但是大家都不说破：自己在台上自顾自演了一辈子，坚信是唯一的主角。等枪声响起，低头才发现自己身上其实根本就没有主角光环，一根根光线正从身后透射而出。", "我演不了主角，我更擅长演配角。世界是主角，互联网是配角；互联网是主角，互联网写作是配角；互联网写作是主角，写散文杂文的是配角。所以，我是配角的配角的配角，在世界边疆的边疆的边疆。写了那么多年，写过那么多字，如果要说真有的什么心得，其实就只有非常简单的一点：所有展示自我的文章都随着时间灰飞烟灭，所有为别人写的文章都依然在世间流传。无论是《陌生人，我在春天等你》，还是《约定---给一位读者》，到今天都还有人在读，还有人跑来评论。但所有那些我当众展示如何一举击杀对手的文字，在最初的热闹过去后就彻底陷入沉寂，然后轻而易举地就被人们所遗忘。在自己的文章里做配角，写给自己不认识的主角，这是让文字获得生命力的唯一方式。这世界上的自我简直太多了，每一个愿意主动让座的自我都显得那么珍贵。", "从2003年开始，每年的11月5日我都会写一篇文章祝自己生日快乐，这些文字大概是我写过的最为自我的文字。今天重新去翻寻的时候，发现有一半已经消散在了网络里。你看，自我总是这样不断分崩离析，永恒不变的只有变化。现在我把还能找到的七篇一并贴出来，作为一份礼物送给你。为了感谢你的耐心，也为了纪念我漫长的陪伴。", "谢谢你愿意读一遍《配角的独白》。祝我生日快乐！"]], "2015": [["最近，每个清晨都有个白衣胜雪的天使站在我的床头猛击铜锣，然后俯身对着我的耳朵大吼大叫：“起来！你都快四十岁的人了，好意思吗？”我明白，他的意思是我应该活得更得体一些。言谈举止要稳重，要小酌不要贪杯，要早起不要恋床，不要一年去一次运动超市买12件一模一样的XXXXL黑色T恤回来穿。既然头发快掉光了，且努力把肚腩收起来，给年轻人一点希望，免得他们觉得中年之后全然是不堪，后续所有的生日只是活得长的荣誉奖项。", "一次生日，就是一阵焦灼。", "10月15日那天，我心有所感，写下一句话：人到四十什么感觉呢？就好像你在屋子里坐着，四面墙都在冲你倒下来。然后呢，二、三十岁的时候，你还可以找朋友喝一杯，倾诉一下。四十了，环顾四周，所有的朋友都在瓦砾里奋力往外爬。所以北岛写得极好：如今我们深夜饮酒，杯子碰到一起，都是梦破碎的声音。", "我终于成为菜头叔，支离破碎生活里狼狈不堪的中年男人。这话不好听，但胜在坦诚。我不相信音乐、沉香、瑜伽、中药、红酒、手串、咖啡、仁波切、毛笔字、正能量、对襟小褂和有机食品，正如我抗拒看报纸、杂志、电视和开淘宝店。我想，我永远也无法用这些东西把自己包装成为一个饭局上有趣的中年人。我曾经惧怕缺乏共同话题，我唯恐冷了场面，现在我觉得就这么沉默着，其实挺好的。为什么在晴朗的夏日午后，喝到一瓶好的冰镇啤酒时应该紧闭嘴巴？这其实挺有道理的。所谓享受，就是要避免一切不必要的耗散。比如了解别人，或者被人了解。", "四十岁的时候，终于可以享受一点年龄带来的福利。我在一夜之间领悟了红烧牛肉的奥秘，前后的区别有如霄壤。从一个朋友家到另一个朋友家，从一种赞叹到另外一种赞叹，这件事我做得流利爽快。厨房就是我的结界，无需思索，没有犹豫，几乎全无控制，却总能从容不迫、应付裕如。仿佛前四十年吃过的每一餐红烧牛肉都已经再无秘密，时间洞穿了所有的厨房秘籍，留下的只是随心所欲。不用在乎锅灶是否完备，调料是否齐整，不再在乎从哪里出发，你确信可以抵达预期的终点。", "然后恍然之间觉得已经给所有东西都套过糖色，都放在小火里焖烧，都用大火收过汁液，于是转去做清炖。试着用更少的调料做出更丰富的滋味，就像是排骨汤里的玉米，糖所无法提供的清甜，高音部分的和弦，香水的尾调。娴熟的另外一面是拆解，福利保证你不再因此遭受惩罚。这是难得的特权，去掉顶棚，去掉挡风玻璃，去掉座椅皮套，去掉门和地胶，观察一辆车在多大程度上还能跑着。事实上，绝大多数车子依然还在跑，而且速度快了许多。可以称之为“世界本源”的东西正在慢慢呈现，且不用庸俗到需要动用心灵就能够觉察。", "所以，有些话可说不可说就不再说了，有些字可写不可写就不再写了，有些人可见不可见就不再见了。人生做减法是全然的疯话，只不过是河流终究流向大海，就不用去徒劳无益地添加支流，说到底，是怕了麻烦。", "我听说人的一生里有两次转折的机会。一次是在中年，在重重重压之下一扫颓丧，盛放出百倍灿烂于青春的花朵；另一次是在暮年，再次迸发出耀眼的光亮驱散死亡的寒冷，就像是马蒂斯最后的建筑。我在四十岁的时候，祈祷自己能够获得其一。毕竟，我选择了那条少有人走的路，而且不打算再次戴上领结，也不再求取赦免。", "短信里有十家公司说：和先生祝您生日快乐，下载我们的APP您就可以得到一份生日礼物。", "和菜头2015.11.05"]], "2014": [["这一岁过得并不顺，发生了许多剧烈的变故，一夕数惊。所以，每次看到那些对我的文章挑挑拣拣的留言，我都很钦佩自己。无论我在生活中遭逢了什么，文章却能一直做到流畅优美，并不因为个人的情感或者境遇，有什么高低起伏。甚至，在我最不快乐的时候，也依然能写让人爆笑的文章。", "人们并不会觉察这一点，只是因为我写得多而快，于是把一切都当作是理所当然的。每晚6点钟，文章准时推送而至。谁会在意小区里早上的牛奶，晚上的报纸呢？谁又会在意一个牛奶工，一个送报童是否吃饱穿暖，心情好坏高低呢？偶尔延迟，肯定还要抱怨投诉。", "我没有什么负面情绪流露，我也没有个和菜头可以在他的微信公众号里哭诉。任何时候，我都高高兴兴写文章，实在觉得今天没有什么值得写的，就从过往的博客里挑选一篇自己满意的贴出来。从去年的11月5日到今天，我写了354篇文章。所谓简单的事情重复做，就是这个样子。可是，能做到的人又有几个呢？", "最陌生的人，往往是你每日所见。我和这里的几十万人每天通过微信发生联系，累积过千万次的访问，我们之间依然是陌生人。你看那么多，但其实根本不了解我。", "之所以还在写，早就不再是为了寻求理解，或者是获取承认，仅仅是为了顺从本心。就像是马，它的本心就是奔跑。有一块草场在，无论有没有其他的马，它都会跑起来。我写文章是因为我高兴，写成一篇之后，念头通达，暗自欢喜。而且，自从我脱离了大大小小的圈子，下笔就更没有任何忌惮。不结恩怨，不落因果，自然畅快通达。", "最早写博客的时候，只得400个读者，我称为四百击，每天四百下点击之意。光阴荏苒，这400个人还跟着读到今天的，大概十不存一。走着走着就走散了，跟不上了。偶尔和故人相见，大多都容颜憔悴，身心疲惫，不复往日的风采。只有到了这种时候，我才会意识到自己原来和别人并不相同。我还在，但是他们都不在了。", "别人生活了几十年，我还没开始走进。或者说，他们定义的那种生活，我还连脚尖都不曾蘸湿。以智力而论，我算不得聪明人。记忆力不好，运算能力不足。从小学开始，周围都是比我年纪大，体力强，头脑聪明的大孩子。我要非常努力，花费额外的时间，才能打个平手，或者超出半个身位。", "别人问一句：你的复习计划呢？我就只有瞠目结舌，不知所云。什么是复习？什么叫做计划。这两样东西在我的世界里根本就不存在。学习的目的是搞定这一章，就可以玩新的一章，为什么要复习，为什么要计划？及长，又有所谓职业规划和人生规划。听了依然瞠目结舌，不知所云。从格子间混到独立办公室，我哪里知道如何规划得出来？城里有房，房中有厅，厅有沙发，沙发对面是电视，大多数人的人生规划无非也就是这个。有电视就可以把电视里的东西买回来，有沙发就可以躺在上面想一场场说走就走的旅行，说上就上的爱情。", "分界点就在于这里：你是向一个存量世界伸手索取，还是去探索一个新世界？这明确地把人分做了两群，两种世界观。", "8月份的时候，我和两个朋友去欧洲玩了21天。到机场会合的时候，大家见了面哈哈大笑。因为每个人都只有一个背包，一个小拉杆箱，可以随身带上飞机，无需托运行李。而且，大家都抱定了一个想法：缺什么东西，去当地买呗。回想起来，如果这三个人不是这样，估计欧洲之旅一辈子大概都不会成行。", "这个世界是由乐高积木构成的。有的人花了十年之间，绕了个小圈，就开始拿起这个小圈里的积木搭建他的生活。有的人花了几十年浪游，并不急着兴建，而是想弄清楚这世界上到底有多少种积木碎片，以及它们组合的可能性。于是，他可以制造城堡和飞龙，在这个乐高世界之上，创造一个新世界。走入无人之境的你，可以造物。", "纯粹的天真，纯粹的疯狂，以及纯粹的坚持，可以无视小尺度空间的生生灭灭，触摸到世界最真实的规则。最深刻的奥义，存在于最通俗的语句里。如果要问我这三十九年人生的感悟，它就只有一个词：", "Banana！", "生日快乐！和菜头先生！"]], "2013": [["今天是我的生日，凌晨的时候，陈坤在微博发布了我的Q版新头像，于是祝贺瞬间雪崩。我在朋友圈发帖，许多潜水的人一下子浮出了水面，非常壮观的样子，我差点决定每周过一次生日。", "转眼就到了三十八岁，四十在望，这让人感觉到焦虑。从三十三岁离开国企，在江湖上飘荡，五年时间过去了。我离开了人生的大路，背着包，手里攥着一根棍子，在荒野里游荡了整整五年。这五年时间，比一世都要长。", "今年8月14，七夕节。我在凌晨时分确认了一些事情，百感交集。于是下楼吃面，回来在朋友圈发了一篇长文。它是我这一年来心情的真实写照，今天是生日，发表出来权作纪念：", "《我正在雨里吃车仔面》", "711的车仔面，要了辣椒调料，滚落几枚鱼丸，黑地里看不见面条的金黄颜色，只有雨水不断从天上落下来。落在厚厚的树叶上，落在漆黑的马路上，落在远远近近的屋顶，也落在面碗里。整个世界都在下雨，全世界的雨点都落在我的碗里。", "我一点都不在意，因为我很开心。就在几个小时前，我还感觉非常沮丧。现在我却很开心，也许明天醒来，又有新的事情发生，再次把我打落绝望之渊。无常就有那么迅猛，就有那么无情。但是这都不重要了，有这一刻就好，有这碗面就足够了。", "五年之间，上一次那么开心还是在腾讯的时候，B4立项成功，下楼来觉得做梦一样，所有的轻浮之情升腾而起，觉得自己骨头都轻了半斤。那天喝了几瓶老金威，冰镇的，轻飘飘地就过去了。那一晚，我一个笑话都没讲。", "然后就是漫长的五年，艰难的程度比我预想的要难五倍。我以为只会是难，没有想到上面还有艰难、痛苦、怀疑、绝望、求死不得五个层级。也许还有别的层级，不过我还没有遇见，也不知道能否继续忍耐下去。", "连天连夜的战斗，战斗之上还有战役。每一次新尝试之后是一次新失败，新失败之后是新尝试。这种看起来永无止境的循环中，我自嘲说我是「屡战屡败屡战，一计不成又生一计又不成又生一计」。我不怕失败，但是失败太多了，多到我怕我自己就要怕了。", "所以，此刻开心的感觉如此强烈，不是因为我觉得自己要胜利了，而是在看似无尽的挣扎中距离害怕远了一点。并不多，一点点而已。若不是身在事中，以旁观者的视角看去，大概觉察不出任何异状。唯有耐心的花匠，才能感觉到土壤下种子在破壳。", "于是没有人可以分享这一刻，我说什么才好呢？我又能说什么呢？况且又是这样的七夕，这样的雨夜。我只能自己默默地高兴一下，钱不多了，刚够给自己买一碗车仔面。", "此刻，世界上有多少个房间还亮着灯，又有多少种情绪在夜色里泛滥？有多少大大小小的欲望在生生灭灭，又有多少人只是醒着听雨声却无法睡去？谁在倾诉，谁又在倾听？", "我正在雨里吃车仔面。"], ["在三十八岁生日的凌晨，我想起了二十年前在南京大学浦口校区里抓小龙虾的那个下午。淤泥深及大腿，水温不到十度，但是燃烧着的荷尔蒙像是给身体套上了一层盔甲，以至于可以徒手伸入没肩的水洞，把愤怒的龙虾抓出来。那天下午太阳很暖和，风也不是很大，田边是一群拿着塑料桶等龙虾的伙伴，说说笑笑。当我侧身极力伸展手臂向深处挖去，耳垂机会都贴到了水面，那些说笑声听起来就显得极为遥远而不真实。直到手指尖感觉到水里突然有了一点波动，就可以惊恐地期待。未来不到两秒的时间之内，有一只红到发黑的大螯，会猛地出击，牢牢钳住我的手掌不放。然后我握住两只螯，把它拖出来，甩到桶里去。岸边会响起一片欢呼声，人们围拢在桶边惊叹它的个头，它的气力。我赤足站在泥里，翻过手掌，看着暗红色的血一点点冲开黄褐色的淤泥，慢慢顺着泥水流下来，这时候冻麻木了的手才开始有一丝疼痛的感觉。", "大概半年之后的夏天，我才知道原来龙虾根本是用钓的，没有人会用手去抓。", "我手掌上那些横七竖八的伤口全都好了，一点痕迹都看不出来。哪怕我是疤痕体质，这么多年过去，那些疤痕也都悄悄消散了。和其它少年时会做的蠢事相比，抓龙虾算得上是好的。那些为了彰显勇气而用火柴烫出来的圆形疤痕会留存一生，而用针蘸着蓝黑墨水刺出来的文身只会随着岁月流逝显得更加丑陋狰狞。我从未在自己身上试验过这些玩意儿，原因是我怕疼，但是我又不怕龙虾，大概是因为前者的痛苦可以预期，而后者不可预期的痛苦里隐藏着巨大的兴奋---因为那些水洞里可能藏着鳖和水蛇。也因为握住大螯的一瞬间，就像是和水下世界定下了某种契约，我是未知世界里的一个访客，握手是一种对话方式。烙伤和刺青则是一种献祭，向着遥远的成人世界致敬，表示自己有足够勇气能够进入。我对自己是什么，有什么，向来兴趣不大。", "今天我三十八岁，进入成年人的世界已经很多年。一个无所不能的成人世界并不存在，一种可以对生活应付裕如的心态也并不存在。很多你小时候找不到答案的问题，在成人世界里依旧没有答案，只不过大家不再发问就是了。很多你小时候觉得长大了就可以解决的麻烦，那些觉得可以依仗金钱、气力和成人形貌能解决的麻烦，大多数的确解决了，不过因此而付出的代价却让人觉得更加麻烦。因为你不再是一个抓龙虾的人，你自己就是龙虾。", "你需要赶快打一个洞，把自己藏在里面。你得努力把洞穴挖得又长又深，免得轻易被人抓走。你有了一个洞穴之后会觉得不满意，你希望多有几个出口，一个靠近水，一个靠近田，一个能看得见风景。你是如此努力挖洞，有时候甚至凿穿了田埂，把水全部放了出去，于是你会遭遇可怕的惩罚。而其它龙虾漠然看着，耸耸肩表示这是运道太差。那些洞穴挖了又塌，塌了又挖，你终于有了一个四通八达的水下宫殿，却发现一生中最美好的时光是和另一只龙虾轻轻扣着大螯，在水下漫步，而那时你们甚至连一个洞穴都没有。", "我这二十年间挖了好几个半途而废的洞，原因是挖到一半就会止不住地去想：我这是在干什么呢？这真是我想要的东西么？答案从来都是否定的。于是我又问，是什么让一头龙虾经年累月地挖泥？答案是期待。期待有更多食物，更大的水域，有更漂亮的风景。期待的另外一个名字叫做恐惧，恐惧饥馑，恐惧受限，恐惧所有期待不发生，于是挖洞不已，我觉得这个解释要更为合理一些。是恐惧让人保持在既有轨道上前行，不逾规矩，仿佛从开天辟地以来事情就应该是这个样子的。不是没有别的出路，也不是没有别的选择，而是那些选择对应着的可能丧失，就已经让人恐惧得完全没有理智了。", "甲壳类昆虫也可以飞行的，起码在《星际争霸》里是这么说的。", "周围的人在接近四十岁的时候，逐渐沉默。无论曾经的期待是什么，在这个年岁上发现失去的东西要更多更快。曾经可以依仗的一切，效用程度不同地发生下降。理想变成了给别人服用的兴奋剂，激情还可以维持一时兴奋，但是似乎最终的结局还是灰烬。永恒的贪婪要好一点点，但是它也最容易让人感觉到厌倦。甚至是欲望本身，当它无法再次驱动人产生行动，或者行动成效甚微，它也会变成抑郁的根源。有时候事情很奇妙，比如说在你十几岁的时候不屑一顾的“三观”，现在却成为了一种坚硬的真实。你的三观是什么，你如何看到自己，看待社会，看待世界，决定了你的动力能够燃烧多久，把你送到多远的地方去。理想、激情、欲望、运气，以及自以为的聪明，都会在这个阶段耗尽，让人在空茫茫的一片空寂里漂浮。“嗨，今天，你有什么新鲜事？”", "三十五岁之前，总觉得还来得及，还有得是机会和时间。三十五岁之后，会觉得命运的鼓点越来越急切，而沙漏像瀑布一样倾泻而下。时间不够了，应该做点什么呢？寻求答案的时间早已经过去，现在是解答时分。人生里无尽的题目汹涌而至，你来不及抬头只能竭力作答，争取填满答卷。所有你曾经认为是想明白的事情，所有那些你那在手中的结论，此刻都要面临考验，而其中的绝大部分都会被击得粉碎。因为它们都是前三十年你问别人借来的东西，没有几样可以真正算做是你的。偿还的日子到了，你可以凭借什么站到下一个三十年？", "博尔赫斯说：命运之神没有怜悯之心，上帝的长夜没有尽期。你的肉体只是时光，不停流逝的时光，你不过是每一个孤独的瞬息。", "生日快乐！和菜头先生！"]], "2012": [["今天我满三十七周岁，本来想说一句“别怕进入三十岁，因为很快你就会开始担心慢慢靠近的四十岁了”。这漂亮的俏皮话适合放在微博上说，但是不适于写在这里。事情不是这样的：你获得了经验，拥有了头衔，甚至都有几分睿智了，可以轻松一点过活，游刃有余地行走在社会里，开始感受成熟带来的福利。真的不是这样，三十五岁之后的感受更像是结束了适应性训练，生活要给你来点真格的。它的重量在短短几年里翻着跟头往上涨，世界也并没有安宁下来，而是日甚一日的疯狂旋转。除了继续挺下去，似乎你也没有别的选择。只是在这重压之下，难免会隐隐有些担忧，觉得自己会在某一刻终究承受不住，就那么一下子倒下来。", "二十多岁的时候，感觉是自己张开双臂迎上世界。三十多岁的时候，情况则是整个世界向你倾倒过来，听得见自己身上骨节噼啪做响，一口气屏住不敢有丝毫松懈。压力来自四面八方，却不再耗费你的体力，甚至无需动用你的智力，它只是简单地耗神，好叫白头发顺着两鬓疯长。我觉得在这个人生阶段应该持有一种坦诚的态度，正如此刻去接受生命变化带来的这一系列重量。如果自己已经被生活之锤反复锻造成一块通红的铜，那么就应该像块铜的样子。不要解释为自己内心火热，也不应承诺自己还将坚固。靠坚固和锋利可以走到今天，但我猜想接下去需要的只会是坚韧。", "怎么理解这种变化呢？当自己还是个愣头青的时候，世界由门组成。缓缓推开也好，飞腿踹开也罢，那时是暴力破解的年月。世界有无限多扇门，你可以打开无限多种可能。但是探索到一定的时间，你终将明白一点：一生不可能全然在不断开门里度过。一定有某扇门，或者某几扇门，打开之后自己可以走进更深远的世界。把自己托付给智慧也好，纯粹的欲望也罢，你会一路这么走下去，那是属于你的一部分。你可以为之努力，在自己的沙漏清空之前走到你认定的处所。并且，因此不再羡慕别人选择的门，和别人走过的路。知道自己能力所能达成的极限，这是狂心消歇的开始，但是并不会让人感觉到多少快乐。", "因为许多东西会因此崩坏掉。有些你曾经认定是坚固的，甚至是美好的东西，很快会因此而破碎。当你仔细地领悟到人人时间都有限这一点后，就会很快看明白大家都在舞台上为了什么而急切。许多漂亮的大词都会因此而支撑不住，许多漂亮的人物也都会因此而原形毕露，你看见其实只有生存法则在起着作用，无非是在它驱动下的行为中有些更具迷惑性，而另外一些容易图穷匕见。凡事问一句：他/它指着什么吃呢？“以何为生”是把锐利的刀子，用来做现象和实质的切割再合适不过。一地零碎之后，会发现可以称之为真正问题的不多，可以称之为纯粹观念的东西也不多。往昔自己曾追逐的热闹就像万花筒，炫目的幻相之下只有三棱镜面和一些碎纸屑而已，它们对现实无能为力。", "我个人的现实又是什么？", "我有了间书房，书架上放了三盆绿色植物。因为烟熏的缘故，它们都羸弱不堪，叶子总是无法垂下来，按照当初设计的那样遮住书架的最上一层。书桌上是一台笔记本电脑，边上总是摞这几本书。看完一本就撤掉一本，有新书来就继续码上去。在书和电脑之间，则是无数的转接线、连接线、充电器以及各种小型电子产品。中间有一直蓝色的塑料盒子分外醒目，里面是一个塑胶的半透明牙套，叫做“止鼾器”，据说可以防止呼吸暂停。没有人会在二十几岁的时候担忧呼吸暂停症，但是在我这个年岁，就得开始像个拳击手一样咬着牙套，连睡梦都变成了致命的拳台。以前总希望自己能在人生路上“武装到了牙齿”，我却不知道竟然是以这样一种武装方式。", "书桌是既有之物的陈列，笼罩贪婪的光辉。止鼾器则是对于死亡的恐惧，那暗影已经渐渐逼近。35岁可能是人类有史以来的平均寿数，考虑到数百万年的时光，这个数字可能还会更小一些。这也就是说，即便现代社会里的人能够活到七、八十岁，但是有些恐惧已经写进了DNA里。远离了天花、肺结核，人到了这个均数的年龄之后，还是会无端端地觉得恐慌。加上所谓本命年的存在，如果你又恰好在事业上选择了较为艰难的路线，那么总是会觉得心头沉甸甸的，又不知道为了什么。而与此同时，你的朋友熟人家里在添丁，自己的父母却垂垂老去，生命的潮汐涨落带来秋日的萧瑟。人们这时去繁衍后代，与其说是赋予孩子生命，倒不如说是因为新生儿点亮自己的生命驱散开死亡的阴影。我看到朋友们情深入许，为孩子写下深深浅浅的文字，其实也都是为了自己，给自己中年的生命一次重新赋值，似乎和更为遥远的未来扯上了什么关系，自己因为责任而拥有了某种价值。为别人活着或许是令人烦恼的，但是若无需如此，则需要更大的重量避免自己的灵魂随风飞去。就这样，少年人一路远奔，此时却渐渐回返原路。有的人说：我惊讶地发现自己变成了年轻时所厌恶的那一类人。也许吧，只不过那时候生命还没有多少重量而已。", "我已经觉察到很多变化，包括夜里额外多出的一次起夜，包括案头常备的胃药。以前会相信一切不适都是暂时的，一觉起来也许都会好起来。即便一时不是如此，也有信心认为会有那么一天。现在我不那么想了，我开始相信可能从此要带着这些不适一路走下去。这固然让人觉得不那么愉快，但也只能作为生命的一部分接受下来，就像树木带着节疤继续成长。继续长下去，带着所有不适的人物和事情。树就站在那里，似乎除了这么继续下去，也不会有什么别的选择。在追寻一个美好的世界如此之久以后，试着和一个不那么完美的世界并存。当我再次看到这世界的黑暗创口时，想得更多的是自己身上对应着的疮疤，想着我们彼此映射，想着自己不可能飞升到纯粹的光明里去。", "本命年里会有许多选择，黄历上却写着诸事不宜。带着这样的压力、疲惫、创痛和恐惧，为什么还要走下去，又要走向哪里？几天前和老友们喝酒聊天，我的一位老哥哥说到他生意上的事情。他说他费尽千辛万苦，终于中标签合同。可刚到工地的时候，就被甲方一个小他二十几岁的姑娘恶骂凌辱。他坦诚地说，在那一刹那，他很想计算一下这些年赚了多少钱，如果达到自己心里那根保底的线，他想立即退出，什么都不做了。也正是在那样一闪念之间，他被自己的这种念头所震惊，“我怎么会变成这种人了？”老哥哥一下子就崩溃了，羞愧让他泪流满面。和压力相比，更可怕的是自己背叛了自己。而困难之处在于，到了这样的年岁，即便你这么做了，也没有人能指责你什么。反而可能会赞扬你务实，懂得进退之道。", "我倒宁可继续活得虚无一些，看不清楚十年之后会是怎样。始终留存有一夜之间一切不复存在的可能，这让人能够走得更快一点，更远一些。就像我的老哥哥他们一样，坦诚地面对自己的欲望，坚定地捍卫自己的审美，然后严厉地对待自己的怯懦。当初是自己选的这扇门，那就要一路走到底。我们是那样的不完美，却又是如此的坚韧。软弱有时，脆弱有时，但总是要开出花来。"]], "2010": [["今天我满三十五周岁。五年前的这个时候，觉得怎么可能自己就三十岁了。五年后的今天，可以说我基本上适应了三十岁的人生，没羞没臊地当起了“和大叔”。当然也就有了一堆三十多岁人的毛病，例如今年爆发的痛风让我坐了四天轮椅，以及不时疼痛一下的腰椎和颈椎。记得我腰身柔软，站直了腿，手可以在地上平平整整按出两个掌印。现在不成了，我不知道是筋骨变硬了，还是肚子变大了，总之，我买了很多没有鞋带的套鞋。", "如同第一段读起来的感觉那样，人到三十五岁会透出一种懈怠和慵懒的调调，这岁数是只黏人的肥猫。可是，人生的变化却依然很快，尤其是对于我这样的人来说尤其如此。有生以来还没有那一年像这一岁一样发生了那么多事情，先是忙到没有写Blog的时间，然后是忙到没有写Blog的心情。当一个人到了三十中间，头发掉落，肚子突起，面皮开始有些松弛，人们就倾向于把你当成个专家，急急忙忙给你个头衔，然后拉你到各种台子上去使用一下。生活也变得安定下来，人们会主动给你些活计，或者让你帮帮忙什么的，于是就不再问自己“怎么能活下去”这种问题。", "来北京之后，这个问题我问了很久。在我很年少的时候就获得了一种认知：这个国里每个人都得有个单位，这样的人才能过上稳定安康的生活。只有那些做了坏事的人，或者是资本主义国家里的可怜人，才没有一个单位愿意管他，只能不断找工作，换工作。两年前我是有单位的，单位，就像是某种丹书铁券、免死金牌，给与你某种人生的保证，把你和外面的风雨飘摇、朝不保夕隔离开来。当我自己选择走进雨里，我就为恐惧所笼罩，觉得自己不再受到保护。我不得不惭愧地承认这一点，一开始，我的确时常怀念那种被保护，被庇护感觉。放归自然后两年，经过700多个日日夜夜的天然野化，我依然不知道明天会怎样，我还是回答不了这个问题，从没有一个计划表，也不存在职业规划书，但是不知道为什么，我却免除了那种对失去单位的恐惧。谈不到我爱上了这种风雨飘摇，爱上了这种朝不保夕，但我觉得我习惯了这样的生活。就像是草原上的肉食猛兽，它趴在岩石上眯着眼睛吹风晒太阳，然后懒洋洋地舔自己的皮毛。它说不上爱或者不爱眼前的一切，对它来说，只是在那块石头上什么都不做，然后，舔毛。", "社会接纳了我，我不想说它慷慨仁慈，否则接下来就得说那些感恩一类泗泪交流的屁话，不过它的确肯给机会。我认为这一点比什么都重要，否则人生之路就没有什么选择的余地了。假使换一种情形：你胆敢走出温暖舒适的屋子，那就一定要用落地雷当场把你打成反面教材，烧成一行灰字：看吧，你丫还敢吗？像这样的社会，那当真会让人绝望。相反的，我个人的经历给了我另外一种信心：诚实劳动，认真工作，那么就有可能获得机会。也就是说，自己可以给自己签发就业机会，为自己提供生活保障，且不至于过得面有菜色，衣衫褴褛，让围观人等对这样的人生路充满畏惧之情。这样的生活挺好的，我还经常一个人在家里高唱《爱情买卖》呢。我想说的是，在一个全部都是由单位人组成的世界里也依然可以唱《爱情买卖》，只是没有我那么气壮山河，澎湃豪迈。", "我还拿自己做了些试验。在前十一年的工作中，我目睹了许多的权谋法术、机巧变诈。这些被说成是具有中国特色的管理模式，中间的区别在于是一个强而有力的爹，还是一群强而有力的爹。领导者的权威是由压力、施舍、分化、惩罚、离间这些因素构成，被领导者是无知而软弱的绵羊，需要强力的手腕和军事化管理，才能榨出最大效能。而在我的团队里，每个人都可以说话，而且每个人都可以问一句：为什么要做这个？从到抵达到离开，这样的做法并没有伤害到我的权威。起码我认为，在我的团队里笑声是最多的，团队成员过得很愉快。而这样做似乎也没有影响到绩效输出总量，关键在于他们在做事的时候觉得快乐，而且有意义。甚至，在我缺席的情况下，他们做得要更好。以至于我经常开玩笑说，请务必保守这个秘密，否则公司会认为他们不应该支付我工资。", "和80后，甚至85后的团队共事是一件愉快的事情，包括和我80后的上司共事也是如此。在此之前，我和50后、60后共事，其中哪怕最快乐的日子也不能和这两年中最糟的一天相比。如果我不曾离开原来的小世界，那么我大概永远也不知道原来世界上当真有最简单的人际关系，最省心的管理方式，我大概也永远不会相信中国人能够自己管理好自己，居然可以没有内斗，齐心协力地完成点什么。别把下属当傻瓜，永远和他们说实话，放手让他们做自己喜欢做的工作，我不明白为什么管理学要写那么多本书出来。从蓝藻到人，生命体没有指导手册。这让我确信未来一定会有所不同，因为建筑这个社会的人改变了，他们的组织方式也改变了。总会有一代代不看曾国藩书籍的人成长起来，总会有一代代不把上班当兵法研究的人成长起来，那我为什么不希望在自己的晚年终于能过上稍微正常一点的社会生活？当成长代替了驯化，人就成其为人，这个世界因此会变得柔和许多，也美好许多，我们彼此之间不再是狼同志。", "当然，这样做的代价就是写Blog的时间少了。起初是没有时间，后来则是没有心情。追溯十年前乃至更长的时间，我有互联网理想。今天，这个理想还在，只是发生了很大的变化。我曾经认为网络世界是理想国，是乌托邦，我也曾天真地以为上网的人具备相同的精神气质。现在我终于明白，之所以那么想是因为我想逃。当三亿多人都上网的时候，网络生活就是你避无可避的人群，无处藏身的生活。此前，在生活中你可以逃离人群，进入网络。而今在网上大家再次相逢，让人不得不尝试去了解他们在想什么，在做什么。尤其是在做网络产品的时候，一切都会和你认定的“常识”相互违背。一个人的网络活动半径很难超过10个网站，意味着每天接触到几千人。由5万人组成的网络，和5000万人组成的网络，那是两个世界。小世界中的经验、定理，在大数人群面前完全无效。同样的，上网的少数人群和根本不上网的大数人群，行为和认知也是大相径庭。", "对于忠实阅读我Blog的人群来说，我想讲的话基本已经讲完了。如果要继续说下去，可能必须更换载体，比如小说，或者剧本。对于茫茫大众，我到现在都没有找到能够触达他们的那种语文。我做过一些尝试，效果并不是很好。其中效果不错的，反而增加了我的悲哀，那样做没有任何意思。所以，我宁可多花一些精力在【树洞】项目上。每个人的人生故事都是一本书，让大家自己讲述就好了，我也可以安安静静坐下来当听众。在我的网络理想中，我觉得让每个人敢于说话，要比我个人说得精彩纷呈重要得多。", "在我这一岁之间，考虑得最多的事情是这样的：如何让海量胆怯的、羞涩的，稍一触及就蜷缩起来的普通人有勇气说点什么。如何创造一个地方，能够让他们安心、放松地说点什么。如何维护一种氛围，能够让他们自己有创意地制造点什么出来，而且彼此激荡，相互分享，觉得这点小东西让人快乐一天，让人挂念一夜？如何让他们勇敢地承认：自己的生活，自己的话语，也有自己的价值，不必对此感觉到羞愧，而是值得记录下来，在时间的长流里，对自己有得一个交代。我还不知道方法是什么，但是对于我来说，这就是我的网络理想。", "三十五岁了，我希望在新的一岁里完成一本新书，写一个剧本，再做一件以前不曾做过的事情。"]], "2008": [["午夜零时一过，我就满了三十三周岁生日。翻开Blog，找出了自己写博客以来所有生日的文章：", "2003年，28岁，《11月5日》2004年，29岁，《高速变轨---写在二十九岁边上 》2005年，30岁，《戒烟元年九月十日，三十述怀》2006年，31岁，《比特海日志8月9日，祝我生日快乐》2007年，32岁，《比特海日志20月3日，今天32岁》", "从这个列表就能看出来，从2003年9月15日开始写第一篇Blog《D-day》以来，我已经写了五年多，也在Blog里过了5次生日。如果不算上泡网和牛博写的Blog，我一共写了3944篇。写着写着，就三十三岁了，《虎口脱险》里的机长在修道院里回答嬷嬷的问题时，也说的是这个岁数。", "写这些Blog的时间和精力如果折算下来，应该不是个小数目。当然会问一句：这么做值得么？我不想回答值得不值得的问题，只想请大家看一下上面的列表，点开读一下里面的中文。你们可以看到一个叫和菜头的家伙，看到他一生中五年，看到他在这五年里过怎样的生活，去过那里，认识了什么人，发生了什么事。这就是Blog的威力，也许一篇两篇，一个月两个月看不出什么来。但是，当一个人选择记录，而且经年累月的做下来，呈现出来的就是一份个人的编年史。它和历史教科书不同，和媒体记录不同，它讲述了一个普通人的故事，记载了他的喜怒哀乐，他的人生际遇，他的个人感悟，他在这个世界上经行时所留下的痕迹，他又是如何慢慢成长变化一点点成为今天的模样。", "有时候我也偶尔会翻一翻以前的日志，害怕活着活着就把自己给弄丢了。", "从我三十二岁到三十三岁之间发生了很大的变动。生了一场病，结束了丽江的工作，终于返回昆明。辞职离开服务了十一年的公司，两手空空来到北京变成一个北漂。我的近视增加到了650度，体重在92公斤和105公斤间徘徊。在这一岁里，我目睹了雪灾、地震、闹运以及正在发生中的全球经济危机。也在这一岁里，我的家族里迎来了两个新生儿和一次婚礼，因为工作，我把它们全都错过了。", "选择这样一个时候脱离安稳的国企和体制保护，背着个书包才出门就迎面遇见经济危机，你问我现在的感觉？回答是：我已出舱，感觉良好。最大的危机不是经济危机，而是我内心深处的危机。它在11年前就已经开始酝酿，在今年5月开始爆发，等到今年7月份次贷危机开始的时候，我的个人危机已经解决完了。明白应该如何过自己的一生，在这个世界上如何找到自己的位置，剩下的就是坦然，哪怕全世界后一秒就碎裂成泥也变得无关紧要。到了这个地步，应不应该离职，或者出来如何生存，已经不再是问题，而且不应该浪费时间去想。假设我现在并未作出选择，采取行动，那么我也许会拍着胸口大呼幸运。但是随即我又会因为原公司巨亏25亿人民币，负债率超过98%而懊恼，进而因为减薪而觉得悲愤，最后又想着“如果我去到外面，那么。。。”", "一头驴子不能永久地停留在两堆草料中间无所适从，它总要选择一堆，走过去，吃。而且，吃得就像这是世界上唯一的一堆草料一样。有没有得吃，能吃多久不重要，重要的是别吃错了，而且一错就是许多年。", "在北京的生活和昆明的生活相比，无论是舒适程度还是奢侈程度上评判，都活像真挨了一次经济危机。除了念大学的时候，我还没有用过那么小的厕所和房间，还没有如此频密地使用公交系统，更别说书架上居然只有不到30本书。但是，如果说到个人的精神状态，大概过去的十一年间还没有哪一段时间能如我现在一般兴奋振作，可以颠着小步上楼梯，嘴里哼着小调。以往的富足慵懒让我多有煎熬挣扎，反而是现在的匮乏紧张让我平和安宁，而且生机勃勃。", "这就有点像我念小学的时候，每天渴望着早点到学校去，有新东西可以学，有新玩意儿可以耍。在北京这种地方，只要别把目光的焦点始终放在别人的房子、车子以及女人身上，别憋着想我一定要怎样怎样，那么会有足够多的事情值得去学习和经历，也能从中获得足够多的快乐和满足。在整个90年代，人们以“做天才”为个人诉求。在21世纪的头十年，人们以“要牛逼”为个人目标。但是我研究了一下，Newbe只存在比较级，并没有Newbest（很好的域名，可惜已经被注册了）。", "以前我说过，未若将网络视为漫长的修行。现在我想在三十三岁生日的时候补充一句：不妨把人生当成无尽的学习。所以，今天我要祝和菜头同学生日快乐，继续他的修行和学习。"]], "x": [["10岁的生日让人绝望，念书的日子一眼看不到头。小学才念了一半，中学还要再来六年，然后是四年大学，才能彻底离开学校，才终于没有人管自己。当那颗小小的心灵开始计算13年的时光，仿佛是在看着时光的尽头。一个10岁的小孩子，要去想象13年是怎样一个概念，实在是一件不可能完成的任务。等人人散去，洗干净手脚，爬上自己的床，盖上被子，躺在黑暗中，只能小小地叹息一声。", "20岁的生日让人兴奋莫名，一条漫长而黑暗的隧道即将走到尽头，眼前已经看到了曙光，甚至能闻见青草的味道，忍不住原地起跳，打个响鼻。幻想着毕业那天要穿上黑色的学士袍，把帽子和书本扔得比天还要高。想要跑到高处去，跑到可以看得见整座城市的地方去，站在风里狂呼：世界，我来了！然而真正毕业的那天下雨，班长租衣服的时候晚了，大家只能穿着花花绿绿的T恤站在铁架子上拍照。还没有来得及摆好表情就已经匆匆结束，因为边上还有许多个系的毕业生排队在等。", "30岁的生日让人无比恐慌。一不留神就突然三十岁了，很少有二十岁的人真的相信这一天会来，觉得自己还年轻，觉得自己还有大把时间，觉得自己还可以在这个世界上游荡一会儿，就一会儿，然后就可以收拾心情，准备认真生活。但是三十岁从不等人，他准时按下门铃，穿着三件套西装，皮鞋锃亮，表情严肃沉静，进门第一句话是：说说看，这些年你做了点什么？目瞪口呆、张口结舌的30岁生日，让人坐立不安的祝福，心慌意乱地许愿。来不及，一切都还没有准备好，慌慌张张，就突然三十岁了。心底里一句话循环往复，清晰无比：我还是个孩子！", "并没有多少人真心想去过自己的40岁生日。40岁之后的每一次生日，都在提醒自己已经越过人生的山巅，一切都开始衰败，唯有眼前的美景正在一步步抬升；然而40这个数字又没有大到成为一种荣耀，可以象征个人的阅历、智慧、成就和高寿。40岁之后，许多人并不过生日，他们宁可给孩子过，在儿童蛋糕上的烛火照亮自己的未来；他们宁可给老人过，粉红的寿桃一定是双数，那是过往的岁月里彼此的陪伴。在这样的岁数，所有的怦然心动都意味着危机四伏，所有的幸福美满都意味着转瞬即逝，所以要远离生日，远离狂喜和激动。所谓幸福，只不过是天空也无风雨也无晴，心情不高不低不好不坏，生活的压力和动力能够刚刚平衡，既不期待压力陡增，也不奢望动力无穷。只希望此刻的安宁能多停留一秒，多一秒，这样就已经足够；只希望世界和命运不要转过脸来注意到自己，别出声，别发现自己，安然到老就很好。", "在每一个生日到来的时候，人们都会缅怀过去，幻想扭转时光之箭的方向，逃避命中注定的衰朽。去只能再一次把记忆中过往的美好翻检一遍，感叹流年似水，时光不再。如果时光真的能够倒流呢？", "40岁生日的时候，自己正准备前往30岁，看着父母一点点年轻健康起来，但是孩子越来越小，最后从生活里消失不见。自己用于构筑家庭的技能、经验、金钱正在一点点消失，慢慢忘记自己曾经如何娴熟应对工作和生活的能力，重新回到探索状态，一切又都新鲜生动起来。那么，在一个人40岁生日的时候应该祝福他能够再次上路，再次出发去冒险，并且这一次能发现曾经错过的风景。", "30岁生日的时候，已经不需要三十而立了。掉落的头发会长回来，丢失在人海的旧情人会转回来，所有的怨憎和嫌恶会渐渐变淡，重新回到炽热的恋爱状态，然后一路回溯，回答最早最早看到第一眼的那个时刻。朝着20岁进发，一点点豁免一个成年人的责任，获得更多宽容和原谅，在别人眼里看到更多耐心和期待，人生变得越来越轻松，越来越轻快。再次感觉自己想要去爱，想要去吃，想要去奔跑，但也再次发现自己的钱包空空荡荡。人们在生日宴会上举起啤酒，大声祝福你可以继续穷欢乐。", "20岁的生日的时候，你已经忘记了人世的大半险恶与复杂。你恢复了胃口，整天想着下一顿吃什么；你恢复了性欲，觉得自己是一台行走的打桩机。你回到熟悉的校园，重新再来看那些熟悉的人和熟悉的事，觉得换了一种眼光再来时，你曾经以为的傻瓜也许这一次你在他身上看出了惊人的潜质，你曾经如此费心费力想要打入的小圈子这一次也许你看到的只是浅薄和无聊。你翻开了课本，你得承认在这么多年之后，这是你第一次读懂了它们，读懂了作者想要告诉你些什么。你恍然大悟，觉得世界在心底里渐渐脱去表象，你看到岩层下的博大的脉跳和奔腾的岩浆，你终于明白它是怎么运转，又用怎样的障眼法隐藏真相。", "10岁生日的时候，你在小床上，一个人坐在黑暗里。在别人看不见的虚空里，你清清楚楚地看到密密麻麻的因果线，一头连接着现在，一头连接着遥远的未来。在你心田的最深处，一颗颗种子整整齐齐历历可数，在10年前，20年前，30年前，你目睹过它们生长出来的样子。在你卧室的那张自己画的水彩画，是前天你在花园里见到的那只蓝色的蜻蜓。你在40岁最喜欢唱的那首歌，有一段旋律妈妈曾经在你无数个睡梦中于你耳畔轻唱；你自己的家之所以是那个样子，是因为你用积木曾经搭建过无数次，一想到还需要许久之后才能付诸实际，你一次次气恼地把积木推倒......", "每一个人都活在自己的三生三世里，在每一刻之中同时经历过去现在和未来。此刻我们所做的任何一件事，所说的任何一句话，所动的任何一个念头，都源自遥远的过去，源自那个遥远的我，也将会影响到遥远的将来，影响到那个尚未到来的我。这就是生日的意义，它并非是时间戳，也不是纪念日，它只是一次暂停，让我们快进或者回放，在过去和未来之间安放此刻的自己。", "祝你今天生日快乐，也祝你所有非生日快乐！"]], "x2": [["如果此刻我可以穿越时光之雾，站在20岁的我面前，我会对他说些什么？", "那应该是1996年的南京，汉口路22号，北园林荫道尽头的教学楼。现在是《流体力学》授课时间，蒋教授正在黑板上讲解涡度守恒定律，他指着那些粉笔线条要座中的学生理解，涡管是如何在空间里弯曲起来的。白色的粉笔末在他粗壮的手指下纷纷崩落。主教学楼有两种粉笔，一种极为粗劣松脆，是白色的；一种极为细腻紧致，是彩色的。所有的粉笔看上去色泽都要暗淡一些，因为日光从外面巨大的梧桐树影里和蝉声一起折射进教室，空气里有无可计数的绿色。", "我没有在听课，快12点了，我饿。我盘算着本周还有没有希望排上队，可以去计科系哥们的出租房玩电脑。最好不要是周六，那天有我最喜欢的影视鉴赏课，可以看《大河恋》。当然，如果去出租房的话，我还得去买只盐水鸭。刚刚领到上个月家教的工资和图书馆勤工俭学的补贴，钱应该够，能加点肴肉和几瓶金陵干啤。不能花太多，否则这个月又没有烟钱了，山茶不是人抽的烟。对了，明晚是口语课，又可以见到GII了，课后大概又要带我们去酒吧喝威士忌，去迪高跳舞。妈的，图书馆借的六本书已经看完，等会去食堂的时候还得顺手补几本，下午不想上课了.....", "我看着他狼吞虎咽吃下一斤米饭和两块大排，连垫着的白菜梆子和汤汁都没有放过；我看着他借着勤工俭学之便，每2天从图书馆借出六本书，通宵点着蜡烛在宿舍看，蚊帐被烛火燎出了一个个大洞；我看他把日程表安排得满满当当，打工、旅游、下棋、听音乐、看电影、参加社会实践、安排打架的兄弟跑路.....就像是一个疯狂的陀螺不停旋转，一刻都停不下来。他张开贪婪的双眼，想要领略这个世界上所有的五光十色，什么都想动手摸一摸，什么都想靠上去咬一口。他对这个世界的兴趣，就像他永远饥肠辘辘的胃口，总是没有餍足的时刻。", "他看不见我，他实在是太忙了，就算是站在他的面前，大家有着类似的容颜，他也不会注意到我。对于他来说，这个世界有太多精彩以至于无法停留，而且即便有如此之多的精彩，他还是会经常感到无聊和乏味，他哪里会注意得到一个普通中年男子---他最讨厌的那种大人，带着自以为是的肥胖和面目可憎的成人世界味道。他经过我的身旁，没有片刻停留，穿着丁字拖的脚步也依然迅捷如风。他大短裤飘飘，拖鞋打着他的脚板，发出清脆的“啪啪”声。", "我想叫住他，告诉他说：", "去约206物理系的蒋同学一起吃饭吧，因为你们会在大学最后一年成为好朋友，而且你们友谊会维系一生。但你现在不知道的是，他不会有40岁生日。这是你们最长的一段相处时间，此后你们会在北京街头一次次失散，再一次次重逢。然后，突然一下子，就没有然后了。", "多陪陪你女朋友，你们的日子已经开始倒计时，但你还根本不知道。你现在会觉得她黏着你很烦，不如和兄弟们去打电脑游戏开心。你们都还觉得这样的日子会很长，可以一直继续下去。不对的，再有两年多一点点时间，你们在火车站分手之后，今生就不复再见。此后的许多年里，愧疚之情会化为人身，在无数个梦境里显现，反复拷问你：你尽力了吗？你为她做过什么改变？", "要小心物理系和计算机系的那几个混蛋。一年之后，他们会带你半夜翻墙进入物理系的大楼，用论文指导老师的电脑连上互联网。这件事情会永久地改变你的一生，从此你会和互联网发生联系。在未来的岁月里，你会逐步变成半人半网络的怪异生物。等到那个时候，你会自称“和菜头”，以为它不过是个ID或者代号。可是，它会慢慢吞噬你的人格，让你习惯以它的方式存在。你将一刻不停地检索网络，刷新手机。你会在无尽的资讯里不断跳转，为那个世界制造无数内容，并且沉醉其中，维持十多年的狂热，迄今看不到到熄灭的可能。", "因此你可以做到别人做不到的事情，也因此失去了别人可以过的生活。所以，请你小心那个夜晚，当他们发出邀约的时候麻烦你多考虑一秒。哪怕因此会造成我彻底消失，你也应该多停留一秒。那是一个极为重要的分叉口，那一晚如果你没有应约前往，你会过上另外一种生活，一种更有人味的生活。没有那么多痛苦，当然也不会有那么多狂喜。你会需要别人，也会被别人需要。你和别人的生命会以生活的方式纠缠在一起，而不是网线和中继器。你会是个普通平凡的胖子，可你也许会比现在要幸福得多，也能体验更多正常人的情感。", "有一件事情你是对的，你认为自己不会是这个五光十色世界的旁观者而已。你会介入其中，是的，和你当时内心的意淫一样，事情发生了。你会进入你此刻在报纸、广播、电视里看到的那些世界，而不是站在远处眺望，接受那个世界给与你的任何东西。在这一天到来之前，你所担忧的目前的一切，你觉得毫无意义和平淡无奇的生活，其实都有各自的用意。和二十年后相比，此刻已经足够精彩闪亮，只不过是你没有能力去消费它们中的大多数，所以才会时常觉得沮丧和无力，觉得眼前的生活乏味无聊。", "在二十年后，你会明白真正的乐趣是去制造这种五光十色。早年间被压抑了的渴望，在你有能力制造之后，会在你手下迸发出来。这个过程要比欣赏和领略更为漫长，也更加艰辛。需要经年累月的尝试，你才能在不经意间发现一点点进展，却依然不知道它是否在正确的方向上。挫败、沮丧、绝望、自我怀疑会始终伴随着你，是这一路上的常态。不过也正因为它们的存在，会让最后的喜悦变成狂喜，并且最终在狂喜里感觉到辽阔的宁静。我得承认，会有那样的几个时刻，你的确得到了内心的安宁，当天夜里可以睡得很沉。", "我要提醒你的是，在这一路上请保持你的心，不要轻易地偏倚出你的道。无论你选择的道路如何，最好的选择就是一路走到底。中途不要犹豫，更不要耽于犹豫，因为那样会浪费太多人生。等到你回到路上的时候，也许会耗费十一年之久。那么，留给你体会人生的时间就不会太多了。你内心有声音召唤你，那么你就应该去响应，不应该像个中年人那样考虑得失成败。否则，你迟早会发现你所有在犹豫不决浪费的今天，都在百倍消耗你在未来可能得到的人类的幸福。你在今天对于明日的恐惧，在采取行动之后多半并不会发生；但是，如果你静默站立，那么等到明日来临之时，恐惧将以惩罚和灾难的面目出现，那才是最让人畏惧的事情。因为在那个时候，你已经没有任何可以抵御的可能---你的昨天已经被你浪费掉了。", "然而，这些话我都不会对你说。因为就那么跌跌撞撞、踉踉跄跄的你也会走到我这里来。该失去的，你总是会失去；该错过的，你还是会错过；该跌落的陷阱，你还是会掉下去，而且还会反复掉下去。可你还是会走过来，你还是会抵达我。即便我能和你说话，修改所有命运的参数，给与你微妙的暗示或者直接的警告，你也不会因此而节省任何时间。因为在生活的烘炉里，我们是铜。无论我们如何造做，捶打我们的时间不会因此而减少一秒。我只是伤感地看着你，看着你再一次走过那些遗憾，目睹它们发生。幻想如果有另外一条道路，是否会有另外一种风景。我看着你在时光之雾那一头，我想对你说：虽然你笨得让人伤心，可我依然爱你。", "最后，我唯一愿意告诉你的是：无论选择哪一种人生可能，你都依然还是个胖子。关于这件事，麻烦你不用多想了，请你平静地接受吧。"]]};
const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fullText(y){
  const list = essays[y]; if (!list) return "";
  const body = list.map((e,i)=>
    (list.length>1 ? `<h4>第 ${i+1} 篇</h4>` : "") +
    e.map(p=>`<p>${esc(p)}</p>`).join("")
  ).join("<hr>");
  return `<div class="essay">${body}</div>`;
}
const nav = document.getElementById("nav");
const tl = document.getElementById("timeline");
years.forEach(d=>{
  const el = document.createElement("article");
  el.className = "year"; if (d.a) el.dataset.age = d.a; el.id = "y"+(d.key||d.y);
  el.innerHTML = `<div class="card">
    <div class="year-head"><span class="year-num">${d.y}</span><span class="year-age">${d.a ? d.a+" 岁" : "年份未标"}</span></div>${fullText(d.key||d.y)}</div>`;
  nav.insertAdjacentHTML("beforeend", `<a href="#y${d.key||d.y}">${d.y}</a>`);
  tl.appendChild(el);
  if (gaps[d.y]) {
    const g = document.createElement("div");
    g.className = "gap"; g.textContent = gaps[d.y];
    tl.insertBefore(g, el);
  }
});

const badge = document.getElementById("age");
let current = "51 岁";
function setBadge(txt){
  if (txt === current) return;
  current = txt; badge.textContent = txt;
  badge.classList.add("bump"); setTimeout(()=>badge.classList.remove("bump"),250);
}

    if (!e.isIntersecting) return;
    if (e.target.id === "reply") setBadge("我也 33 岁");
    else if (e.target.dataset.age) setBadge(e.target.dataset.age + " 岁");
  });
},{rootMargin:"-45% 0px -45% 0px"});
document.querySelectorAll(".year").forEach(el=>io.observe(el));
io.observe(document.getElementById("reply"));
</script>
